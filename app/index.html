<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Team Biscuit · Tactical Biscuit Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Team Biscuit">
<title>Team Biscuit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: consola de entrenador. Columna izquierda con los clientes, espacio de trabajo a la derecha; en móvil la lista pasa arriba como tira horizontal. */
:root{
  --bg:#ECF2F1; --surface:#FFFFFF; --surface-2:#F4F8F7;
  --line:#D9E4E2; --line-strong:#BCCDCA;
  --fg:#112120; --muted:#546B68;
  --teal:#0E9188; --teal-ink:#0A6F68; --teal-soft:#DCF1EF;
  --coral:#E8622F; --coral-ink:#B93E14; --coral-soft:#FCE7DE;
  --btn-bg:#0B7A73; --btn-fg:#FFFFFF;
  --ink-btn:#0E1514; --ink-btn-fg:#FFFFFF;
  --badge-fg:#FFFFFF;
  --good:#1B7F47; --warn:#9A6A00; --ink:#0E1514;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A100F; --surface:#121B1A; --surface-2:#182322;
    --line:#243433; --line-strong:#35504D;
    --fg:#E6F0EE; --muted:#8FA8A4;
    --teal:#1FB5A9; --teal-ink:#56D6CB; --teal-soft:#0F2D2A;
    --coral:#F07A4B; --coral-ink:#FF9068; --coral-soft:#33190F;
    --btn-bg:#2CC4B8; --btn-fg:#041211;
    --ink-btn:#E6F0EE; --ink-btn-fg:#0A100F;
    --badge-fg:#1A0A04;
    --good:#4FCB82; --warn:#E3B04B; --ink:#060B0A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A100F; --surface:#121B1A; --surface-2:#182322;
  --line:#243433; --line-strong:#35504D;
  --fg:#E6F0EE; --muted:#8FA8A4;
  --teal:#1FB5A9; --teal-ink:#56D6CB; --teal-soft:#0F2D2A;
  --coral:#F07A4B; --coral-ink:#FF9068; --coral-soft:#33190F;
  --btn-bg:#2CC4B8; --btn-fg:#041211;
  --ink-btn:#E6F0EE; --ink-btn-fg:#0A100F;
  --badge-fg:#1A0A04;
  --good:#4FCB82; --warn:#E3B04B; --ink:#060B0A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.shell{max-width:1240px;margin:0 auto;padding-block:18px 48px;padding-inline:clamp(16px,3vw,32px)}

.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.emblem{width:56px;height:56px;flex:none;border-radius:50%;object-fit:cover;background:#000}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.brand-sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.mode{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.mode button{border:0;background:transparent;padding:7px 15px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--ink-btn);color:var(--ink-btn-fg)}
.notice{margin:0 0 16px;padding:9px 12px;border:1px dashed var(--line-strong);border-radius:8px;color:var(--muted);font-size:13.5px}
.notice b{color:var(--coral-ink)}

.app{display:grid;grid-template-columns:292px minmax(0,1fr);gap:20px;align-items:start}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rail-head{display:flex;gap:8px}
.search{flex:1;min-width:0}
#newform{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--surface-2);border-radius:10px}
#newform[hidden]{display:none}
.clist{display:flex;flex-direction:column;gap:2px}
.client{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:1px solid transparent;border-radius:10px;background:transparent;text-align:left}
.client:hover{background:var(--surface-2)}
.client[aria-current="true"]{background:var(--teal-soft);border-color:var(--line-strong)}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal-ink);font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.04em}
.client[aria-current="true"] .avatar{background:var(--teal);color:#fff}
.cl-text{display:flex;flex-direction:column;min-width:0;flex:1}
.cl-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--coral-ink);color:var(--badge-fg);font-size:12px;font-weight:700;min-width:22px;height:22px;padding:0 7px;border-radius:99px;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.badge[hidden]{display:none}
.pad{padding:8px}
.muted{color:var(--muted)}

.main{min-width:0}
.chead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.16em;font-size:14px;font-weight:600;color:var(--teal-ink);margin:0 0 2px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,5vw,42px);line-height:1.02;margin:0;text-wrap:balance;letter-spacing:.01em}
.goal{margin:5px 0 0;color:var(--muted)}
h2{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.07em;text-transform:uppercase;margin:0 0 12px;text-wrap:balance}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--teal)}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}

.btn{border:1px solid var(--line-strong);background:var(--surface);padding:8px 13px;border-radius:8px;font-weight:600;font-size:13.5px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--btn-bg);color:var(--btn-fg);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-style:dashed;color:var(--muted);background:transparent}
.btn.danger{color:var(--coral-ink)}
.btn[disabled]{opacity:.6;cursor:default}
.icon-btn{width:32px;height:32px;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--muted);font-size:20px;line-height:1}
.icon-btn:hover{background:var(--surface-2);color:var(--coral-ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

.in{width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit}
.in:hover{border-color:var(--line-strong)}
textarea.in{resize:vertical}
.num{text-align:right;font-variant-numeric:tabular-nums}
.cell{display:flex;flex-direction:column;gap:3px;min-width:0}
.lbl{display:none;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lbl.show{display:block}
.row{display:grid;gap:8px;align-items:center;padding:4px 0}
.row.head{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-bottom:2px}
.food-row{grid-template-columns:minmax(0,1fr) 84px 84px 84px 32px}
.ex-row{grid-template-columns:minmax(0,1fr) 62px 66px 70px 76px 32px}
.row.head span:not(:first-child){text-align:right}

.meal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.meal-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mname{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.06em;text-transform:uppercase;border-color:transparent;background:transparent;padding:4px 8px}
.mname:hover,.mname:focus{background:var(--surface);}
.sub{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.targets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-bottom:12px}
.tgt label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tgt-in{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.tgt-in .in{max-width:110px}
.tgt-n{margin:6px 0 0;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tgt-n b{color:var(--fg)}
.meter{height:9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.meter>i{display:block;height:100%;width:0;background:var(--teal);transition:width .25s}
.meter.over>i{background:var(--coral)}

.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{border:1px solid var(--line-strong);background:var(--surface);padding:7px 14px;border-radius:99px;font-weight:600;font-size:13.5px}
.pill[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.pill.add{border-style:dashed;color:var(--muted);background:transparent}
.pill[data-i]{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.kpi{padding:12px 14px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.k-l{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.k-v{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums}
.k-s{font-size:12.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:12.5px var(--f-body)}
.chart .ln{fill:none;stroke:var(--teal);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--teal-soft)}
.chart .pt{fill:var(--surface);stroke:var(--teal);stroke-width:2}
.chart .pt.last{fill:var(--coral);stroke:var(--coral)}
.chart .lastv{fill:var(--coral-ink);font:700 13.5px var(--f-body)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.inline{display:flex;gap:8px;align-items:flex-end;margin-top:14px;flex-wrap:wrap}
.inline .cell{flex:1;min-width:120px}

.live{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);letter-spacing:.14em;text-transform:uppercase;font-weight:600;font-size:14px;color:var(--coral-ink)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--coral);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,98,47,.55)}70%{box-shadow:0 0 0 9px rgba(232,98,47,0)}100%{box-shadow:0 0 0 0 rgba(232,98,47,0)}}
.feed-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.feed-bar .actions{margin:0}
.entry{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;padding:13px 6px;border-top:1px solid var(--line)}
.entry:first-of-type{border-top:0}
.entry.fresh{animation:flash 2.2s ease-out 1}
@keyframes flash{from{background:var(--coral-soft)}to{background:transparent}}
.e-time{font-size:12.5px;color:var(--muted);padding-top:2px}
.e-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.e-day{font-size:13px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-variant-numeric:tabular-nums}
.chip.good{color:var(--good);border-color:var(--good)}
.chip.warn{color:var(--warn);border-color:var(--warn)}
.chip.rpe{color:var(--teal-ink)}
.e-note{margin:7px 0 0;font-size:13.5px;color:var(--fg)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:12px}

.phone{max-width:440px;margin:0 auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:28px;overflow:hidden;box-shadow:0 22px 44px -28px rgba(0,0,0,.45)}
.phone-top{background:var(--ink);color:#fff;padding:18px;display:flex;gap:12px;align-items:center}
.phone-top .emblem{width:48px;height:48px}
.phone-top h3{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.04em;margin:0;line-height:1.05}
.phone-top p{margin:2px 0 0;font-size:12.5px;color:#A9C4C0;letter-spacing:.04em}
.ptabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.ptabs .tab{justify-content:center}
.phone-body{padding:14px;display:flex;flex-direction:column;gap:12px}
.exo{border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:10px}
.exo.done{background:var(--surface-2)}
.exo h4{margin:0;font-size:16px}
.exo .plan{font-size:13px;color:var(--muted);margin-top:2px}
.setrow{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.setrow span{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--muted)}
.coachnote{background:var(--teal-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}
.coachnote b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-ink);margin-bottom:2px}
.mealc{border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.mealc h4{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.07em;font-size:17px;margin:0 0 6px}
.mealc li{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:14px}
.mealc ul{list-style:none;margin:0;padding:0}
.mealc li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.notifwrap{position:relative}
.notifwrap[hidden]{display:none}
.bell{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg)}
.bell svg{width:20px;height:20px}
.bell .badge{position:absolute;top:-5px;right:-5px}
.notif{position:absolute;right:0;top:50px;z-index:20;width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:12px;box-shadow:0 18px 40px -20px rgba(0,0,0,.45)}
.notif h2{margin-bottom:6px}
.nitem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px;border:0;border-radius:10px;background:transparent}
.nitem:hover{background:var(--surface-2)}
.avatar.sm{width:32px;height:32px;font-size:14px}
.ntext{display:flex;flex-direction:column;min-width:0;flex:1}
.ntext b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ntext span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:13px}
.ntime{font-size:12px;color:var(--muted);white-space:nowrap}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ph{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.ph.sel .phimg{outline:3px solid var(--coral);outline-offset:-3px}
.phimg{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);display:block;width:100%;aspect-ratio:3/4}
.phimg img{width:100%;height:100%;object-fit:cover;display:block}
.ph figcaption{display:flex;flex-direction:column;gap:6px;font-size:13px;align-items:flex-start}
.btn.sm{padding:4px 9px;font-size:12.5px}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cmp figure{margin:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.upl{display:flex;gap:10px;align-items:flex-end}
.upl .cell{flex:1}
.filebtn{position:relative;display:inline-flex;align-items:center;cursor:pointer}
.sr-file{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.filebtn:focus-within{outline:2px solid var(--teal);outline-offset:2px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.86);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.thread{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{max-width:88%;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--teal-soft)}
.msg p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.mmeta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.msg.fresh{animation:flash 2.2s ease-out 1}
.ptabs{grid-template-columns:repeat(4,minmax(0,1fr))}
.ptabs .tab{padding:10px 2px;font-size:15px;letter-spacing:.05em}
.portal{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.p-top{background:var(--ink);color:#FFFFFF;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:clamp(16px,3vw,26px)}
.p-top .emblem{width:68px;height:68px}
.p-hello{flex:1 1 220px;min-width:0}
.p-eye{margin:0 0 2px;font-family:var(--f-display);font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:14px;color:#56D6CB}
.p-top h2{margin:0;font-size:clamp(30px,4.6vw,44px);line-height:1.04;letter-spacing:.01em;text-transform:none;color:#FFFFFF}
.p-goal{margin:4px 0 0;color:#A9C4C0}
.p-meta{display:flex;gap:26px;margin:0;margin-left:auto;flex-wrap:wrap}
.p-meta dt{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#A9C4C0;font-weight:600}
.p-meta dd{margin:2px 0 0;font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.p-tabs{display:flex;border-bottom:1px solid var(--line);padding-inline:clamp(6px,2vw,16px);overflow-x:auto;background:var(--surface)}
.p-tabs .tab{padding:15px 20px;font-size:18px}
.p-body{padding:clamp(14px,2.6vw,26px);display:flex;flex-direction:column;gap:18px}
.prog{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--muted)}
.prog .meter{flex:1;max-width:320px}
.prog span{white-space:nowrap;font-variant-numeric:tabular-nums}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px}
.exgrid .exo{padding:16px;gap:12px}
.exo-h{display:flex;gap:12px;align-items:flex-start}

.xc h4{margin:0;font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.07em;text-transform:uppercase}
.xc ul{margin:0;padding:10px 16px 6px 34px;font-size:14.5px}
.xc li{padding:2px 0}
.xn{margin:0;padding:8px 16px 12px;font-size:13.5px;color:var(--muted)}
.avoid{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:baseline;padding:13px 18px;border-radius:12px;background:var(--coral-soft);border:1px solid var(--coral)}
.avoid b{font-family:var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--coral-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px}
.tile b{font-family:var(--f-display);font-size:24px;letter-spacing:.04em;text-transform:uppercase}
.tile span{color:var(--muted);font-size:14px}
.pauta{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:0 28px}
.pauta>div{padding:11px 0;border-top:1px solid var(--line)}
/* un cuadro entero por ejercicio */
.exgrid{grid-template-columns:minmax(0,1fr)}
.exgrid .exo{padding:20px 22px;gap:16px}
.exo-h h4{font-size:21px}
.exo-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
.exo-l{display:flex;flex-direction:column;gap:14px;min-width:0}
.exo-r{display:flex;flex-direction:column;gap:10px;min-width:0}
.exo-l .exo-m{grid-template-columns:168px minmax(0,1fr);gap:16px}
.exo-l .exo-ph{width:168px;height:168px}
/* parte que rellena el cliente */
.todo{background:var(--teal-soft);border:1px solid var(--teal);border-left:6px solid var(--coral);border-radius:12px;padding:14px 16px;gap:8px}
.todo-h{display:flex;flex-direction:column;gap:2px;margin-bottom:4px}
.todo-t{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:var(--coral-ink)}
.todo-s{font-size:13.5px;color:var(--fg)}
.setrow2{display:grid;grid-template-columns:30px minmax(0,1.5fr) minmax(0,.9fr) minmax(0,.9fr) auto;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.setrow2:has(.setok:checked){border-color:var(--good);background:var(--surface-2)}
.sn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#fff;font-family:var(--f-display);font-weight:700;font-size:16px}
.sgoal{font-size:14px;line-height:1.3}
.sgoal b{white-space:nowrap}
.sgoal small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sin{display:flex;flex-direction:column;gap:2px;min-width:0}
.sin span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sok{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sok>span{display:none}
.sok input{width:26px;height:26px;margin:0;accent-color:var(--good);cursor:pointer}
.exo-f{margin-top:4px}
@media (max-width:980px){.setrow2{grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) auto}.setrow2 .sgoal{grid-column:2/-1}.setrow2 .sin:nth-of-type(1){grid-column:2}}
@media (max-width:820px){.exo-body{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.exgrid .exo{padding:16px}.exo-l .exo-m{grid-template-columns:104px minmax(0,1fr)}.exo-l .exo-ph{width:104px;height:104px}}
@media (max-width:980px){.trk{grid-template-columns:minmax(0,1fr)}.xcard.wide{grid-column:auto}.form-grid.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:880px){.seg{min-width:200px}.rail{gap:8px}}
@media (max-width:620px){
  .food-row{grid-template-columns:repeat(6,minmax(0,1fr))}
  .food-row .cell.name{grid-column:1/6}
  .food-row .cell.m3{grid-column:span 2}
  .food-row .cell.m2{grid-column:span 3}
  .food-row .icon-btn{grid-column:6;grid-row:1;justify-self:end;align-self:end}
  .supp-row{grid-template-columns:minmax(0,1fr) 32px}
  .supp-row .cell:first-child{grid-column:1}
  .supp-row .cell:nth-child(n+2){grid-column:1/-1}
  .supp-row .icon-btn{grid-column:2;grid-row:1;align-self:end}
  .meso-row{grid-template-columns:repeat(2,minmax(0,1fr));padding:10px 0;border-top:1px solid var(--line)}
  .meso-row .cell:first-child{grid-column:1/-1}
  .meso-row .cell:last-child{grid-column:1/-1}
  .form-grid.g3{grid-template-columns:minmax(0,1fr)}
  .form-grid.g3 .cell[style]{grid-column:auto!important}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .lib-bar{grid-template-columns:minmax(0,1fr)}
  .lib>summary{grid-template-columns:44px minmax(0,1fr)}
  .lib .lg,.lib .ls{grid-column:2}
  .p-tabs .tab{font-size:14px;padding:13px 4px;letter-spacing:.03em}
  .xc ul{padding-left:30px}
  .steps li{min-width:0;flex:1}
  .dt.adh th,.dt.adh td{padding:8px 4px}
  .mc-m{padding:9px 12px}
  .dt.adh{table-layout:auto}
  .dt.adh .hoy{display:none}
  .dt.adh thead th{font-size:10px;letter-spacing:.02em}
  .meal-head{flex-wrap:wrap}
  .meal-head .sub{order:5;flex:1 1 100%;margin-left:0;white-space:normal}
}
/* ---- acceso ---- */
.acct{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
body[data-screen="client"] .rail{display:none}
body[data-screen="client"] .app{grid-template-columns:minmax(0,1fr)}
.login{max-width:520px;margin:clamp(8px,4vh,40px) auto 0;display:flex;flex-direction:column;gap:18px}
.lg-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 22px 44px -30px rgba(0,0,0,.45)}
.lg-top{background:var(--ink);color:#fff;display:flex;gap:18px;align-items:center;padding:24px 26px}
.lg-top .emblem{width:84px;height:84px}
.lg-top h1{margin:0;font-size:clamp(32px,6vw,42px);color:#fff;text-transform:uppercase;letter-spacing:.05em}
.lg-top p{margin:4px 0 0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#A9C4C0}
.lg-form{display:flex;flex-direction:column;gap:14px;padding:24px 26px 28px}
.lg-form h2{margin:0 0 2px;font-size:22px}
.pw{position:relative}
.pw .in{padding-right:84px}
.pw .linkbtn{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px}
.lg-err{margin:0;padding:9px 12px;border-radius:8px;background:var(--coral-soft);color:var(--coral-ink);font-weight:600;font-size:14px}
.lg-err[hidden]{display:none}
.lg-btn{padding:12px;font-size:15px}
.lg-demo{border:1px dashed var(--line-strong);border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--muted)}
.lg-demo p{margin:0 0 10px}
.lg-demo b{color:var(--coral-ink)}
.btnchip{cursor:pointer;font:inherit;font-size:13px;font-weight:600;background:var(--surface)}
.btnchip:hover{border-color:var(--teal)}
@media (max-width:620px){.lg-top{padding:18px;gap:14px}.lg-top .emblem{width:64px;height:64px}.lg-form{padding:20px 18px 24px}.acct .who span:not(.avatar){max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
/* ---- v11: prescripción, tabla de dieta, sustituciones, consentimiento ---- */
.exo-g{display:inline-block;margin-top:2px;font-size:13px;color:var(--muted)}
.rx{margin:12px 0 14px;border:1px solid var(--teal);border-radius:14px;overflow:hidden;background:var(--surface)}
.rx-h{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;padding:9px 16px;background:var(--teal);color:#fff}
.rx-h span{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.12em;text-transform:uppercase}
.rx-h small{opacity:.9;font-size:13px}
.rx-g{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.rxt{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1px;padding:12px 8px;border-left:1px solid var(--line)}
.rxt:first-child{border-left:0}
.rx-l{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rx-v{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1.05;color:var(--fg);font-variant-numeric:tabular-nums}
.rx-v small{font-size:16px;font-weight:600;color:var(--muted)}
.rxt.tempo .rx-v{font-size:26px;letter-spacing:.03em}
.rx-s{font-size:12.5px;color:var(--muted)}
.rxt.rir{background:var(--coral-soft)}
.rxt.rir .rx-l,.rxt.rir .rx-s{color:var(--coral-ink)}
.rxt.rir .rx-v{color:var(--coral-ink)}
/* tabla de dieta */
.dtw{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);margin:0 0 18px}
.dtbl{width:100%;border-collapse:collapse;font-size:15px}
.dtbl caption{caption-side:top;text-align:left;padding:11px 16px;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-ink);background:var(--surface-2);border-bottom:1px solid var(--line)}
.dtbl caption.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.dtbl thead th{background:var(--teal);color:#fff;text-align:left;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:10px 12px}
.dtbl .n{text-align:right;font-variant-numeric:tabular-nums}
.dtbl tbody th,.dtbl tbody td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
.dtbl tbody td.n{text-align:right}
.dtbl tbody th{font-weight:600;white-space:nowrap}
.dtbl .hr{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.dtbl .kk{font-weight:700}
.mrow.next{background:var(--teal-soft)}
.mrow th .tag{display:block;margin-top:4px;width:max-content}
.dtbl .foods{min-width:260px}
.fl{display:flex;gap:8px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:4px 0}
.fl+.fl{border-top:1px dashed var(--line);margin-top:4px;padding-top:8px}
.fl-t{min-width:0;display:flex;gap:2px 8px;flex-wrap:wrap;align-items:baseline}
.fl-g{font-variant-numeric:tabular-nums;color:var(--muted)}
.fl-t s{color:var(--muted);font-size:13px}
.fl-t .alt{flex-basis:100%;font-size:13px;color:var(--muted)}
.fl.sw{background:var(--coral-soft);border-radius:8px;padding:6px 8px}
.fl.sw .fl-t b{color:var(--coral-ink)}
.swsel{width:auto;max-width:250px;padding:6px 8px;font-size:13.5px;min-height:34px}
.dtbl .mc-note{margin-top:8px}
.dtbl tr.trow th,.dtbl tr.trow td{background:var(--surface-2);font-weight:700;border-top:2px solid var(--teal)}
.dtbl tr.orow th,.dtbl tr.orow td{color:var(--muted);font-weight:500;font-size:14px}
.dtbl td.chg b{color:var(--coral-ink)}
.dtbl.mac thead th:first-child{width:34%}
.dtbl.sub .eqs{margin:0;padding-left:18px}
.dtbl.sub .eqs li{padding:1px 0}
.swbar{display:flex;gap:12px 20px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--teal-soft);border:1px solid var(--line);margin:0 0 14px}
.swbar b{display:block}
.swbar span{font-size:14px;color:var(--muted)}
.swbar.on{background:var(--coral-soft);border-color:var(--coral)}
.swbar .actions{margin:0}
/* consentimiento */
.consent{max-width:860px;margin:0 auto;border:1px solid var(--line);border-top:5px solid var(--teal);border-radius:14px;background:var(--surface);padding:22px 24px}
.consent>header{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.c-ic{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:var(--teal-soft);color:var(--teal-ink)}
.consent h3{margin:0;font-size:22px}
.c-list{margin:0;display:grid;gap:0}
.c-list>div{padding:11px 0;border-top:1px solid var(--line)}
.c-list dt{font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--teal-ink);margin-bottom:2px}
.c-list dd{margin:0;font-size:15px;line-height:1.5}
.c-chk{display:grid;gap:10px;margin:14px 0;padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.c-chk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;line-height:1.4}
.c-chk input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--teal)}
.consent .actions{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
.consent .btn[disabled]{opacity:.45;cursor:not-allowed}
.consent-ok{margin:0 0 12px;padding:9px 12px;border-radius:10px;background:var(--teal-soft);font-size:14px}
.consent-ok.row{margin:14px 0 0}
@media (max-width:900px){.rx-g{grid-template-columns:repeat(3,minmax(0,1fr))}.rxt:nth-child(4){border-left:0}.rxt:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:760px){
  .dtbl thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .dtbl,.dtbl tbody,.dtbl tr,.dtbl tbody th,.dtbl tbody td{display:block}
  .dtbl tbody tr{border-top:1px solid var(--line);padding:10px 12px}
  .dtbl tbody th,.dtbl tbody td{border:0;padding:3px 0;white-space:normal}
  .dtbl tbody tr:first-child{border-top:0}
  .dtbl td[data-l]:not(.foods)::before{content:attr(data-l);float:left;color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .dtbl td.n{display:flex;justify-content:space-between}
  .dtbl .hr{display:block}
  .dtbl .foods{min-width:0;padding:6px 0}
  .dtbl tr.trow th,.dtbl tr.orow th{padding:0}
  .dtbl.mac tbody th{padding-bottom:0}
  .dtbl.mac td.muted{display:block;text-align:left}
  .dtbl.sub td.n,.dtbl.sub td{display:block}
  .dtbl.sub td[data-l]::before{display:block;float:none}
  .swsel{max-width:100%;width:100%}
  .consent{padding:16px}
}
@media (max-width:480px){.rx-v{font-size:28px}.rxt.tempo .rx-v{font-size:22px}}
/* ---- v12: comidas bien separadas, plan completo, pantalla completa, impresión ---- */
.dtbl .mrow>th{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1;letter-spacing:.05em;text-transform:uppercase;color:var(--teal-ink);white-space:normal;border-left:6px solid var(--teal);padding:20px 14px}
.dtbl .mrow>td{padding-top:20px;padding-bottom:20px}
.dtbl tbody tr.mrow{border-top:0}
.dtbl .mrow>th,.dtbl .mrow>td{border-top:4px solid var(--surface-2)}
.dtbl .mrow:nth-child(even)>th,.dtbl .mrow:nth-child(even)>td{background:#f6f9f8}
.dtbl .mrow.next>th,.dtbl .mrow.next>td{background:var(--teal-soft)}
.dtbl .mrow:first-child>th,.dtbl .mrow:first-child>td{border-top:0}
.mrow th .tag{font-family:var(--f-body,inherit);font-size:11px;letter-spacing:.08em}
.pl{display:flex;justify-content:space-between;gap:14px;padding:3px 0;border-bottom:1px dashed var(--line)}
.pl:last-of-type{border-bottom:0}
.plan-bar{display:flex;gap:10px 16px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.psheet{display:grid;gap:0}
.ps-h{display:flex;gap:16px;align-items:center;margin:0 0 16px;padding:0 0 14px;border-bottom:3px solid var(--teal)}
.ps-h .emblem{width:64px;height:64px}
.ps-h h2{margin:0;font-size:28px}
.fsov{position:fixed;inset:0;z-index:70;overflow:auto;overscroll-behavior:contain;background:var(--surface);padding:0 clamp(16px,4vw,48px) 40px}
.fs-bar{position:sticky;top:0;z-index:2;display:flex;gap:10px 16px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:calc(12px + env(safe-area-inset-top)) 0 12px;background:var(--surface);border-bottom:1px solid var(--line);margin-bottom:18px}
.fs-bar b{font-family:var(--f-display);font-size:19px;letter-spacing:.1em;text-transform:uppercase}
#printroot{display:none}
@media (max-width:760px){
  .dtbl .mrow>th{display:block;background:var(--teal);color:#fff;border:0;margin:-10px -12px 8px;padding:12px 14px;font-size:22px;width:auto}
  .dtbl .mrow>th .tag{display:inline-block;margin-left:8px;background:#fff;color:var(--teal-ink)}
  .dtbl tbody tr.mrow{padding-top:10px;border-top:0;margin-bottom:0}
  .dtbl .mrow>td{border-top:0!important;padding-top:3px;padding-bottom:3px}
  .dtbl .mrow>td{background:transparent!important}
  .dtbl .mrow>th{background:var(--teal)!important}
  .dtbl tbody tr.mrow{border-bottom:6px solid var(--surface-2)}
  .dtbl .mrow.next{background:var(--teal-soft)}
}
@media print{
  @page{size:A4;margin:12mm}
  body.printing>*{display:none!important}
  body.printing>#printroot{display:block!important}
  body.printing{background:#fff!important}
  #printroot *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printroot .dtbl{font-size:12px}
  #printroot .dtw{break-inside:avoid;margin-bottom:12px}
  #printroot .dtbl .mrow>th{font-size:16px;padding:8px 10px}
  #printroot .noprint{display:none}
}
/* ---- v13: plan completo = réplica de la plantilla Word ---- */
.psheet{--nv:#264653;--tl:#2A9D8F;--lt:#E3F2EF;--zb:#F6F9F8;--bd:#BFD9D4;--gd:#E9C46A;--gy:#6B7C85;
  display:block;max-width:900px;margin:0 auto;padding:22px 34px 26px;background-color:#fff;background-repeat:repeat-y;background-position:center 160px;background-size:min(520px,80%) auto;
  border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.06);color:var(--nv);font-family:Arial,Helvetica,sans-serif;font-size:12.5px;line-height:1.35}
.ps-run{display:flex;align-items:center;gap:8px;padding-bottom:7px;border-bottom:2px solid var(--tl);margin-bottom:16px}
.ps-run img{width:24px;height:24px;border-radius:4px;background:#111}
.ps-run b{font-size:13px;text-transform:uppercase;color:var(--nv)}
.ps-run em{font-size:11px;color:var(--gy)}
.ps-run span{margin-left:14px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--tl)}
.ps-title h2{margin:6px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:700;letter-spacing:0;text-transform:uppercase;color:var(--nv)}
.ps-title p{margin:0 0 14px;font-size:14px;font-style:italic;color:var(--tl)}
.ps-sec{display:flex;align-items:baseline;gap:8px;margin:20px 0 12px;padding:4px 10px;background:var(--nv);color:#fff;font-family:Arial,Helvetica,sans-serif;font-size:13.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;border-left:6px solid var(--gd)}
.ps-num{color:var(--gd)}
.ps-sec em{font-size:11px;font-weight:400;font-style:italic;text-transform:none;color:#BFD9D4}
.ps-sub{margin:14px 0 6px;font-size:12.5px;font-weight:700;text-transform:uppercase;color:var(--tl)}
section>.ps-sub:first-child{margin-top:0}
.ps-ref{margin:6px 0 10px;font-size:11px;font-style:italic;color:var(--gy)}
.ps-x{overflow-x:auto;margin-bottom:10px}
.ps-t{width:100%;border-collapse:collapse;background:rgba(255,255,255,.82)}
.ps-t th,.ps-t td{font-size:11.5px;line-height:1.35;border:1px solid var(--bd);padding:7px 8px;vertical-align:middle;text-align:left}

.drow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:0 0 12px}
.drb{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:inherit;cursor:pointer;position:relative;min-width:0}

.undo-bar{position:fixed;left:50%;bottom:calc(162px + env(safe-area-inset-bottom));width:max-content;white-space:nowrap;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:90;display:flex;align-items:center;gap:14px;padding:10px 12px 10px 16px;border-radius:14px;background:#1f2a28;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.35);transition:.2s;max-width:calc(100% - 32px)}

.ses-done{display:flex;align-items:center;gap:12px;margin:10px 0;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--good) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--good) 45%,transparent)}

function chartSvg(w){
  if(w.length<2)return '<p class="muted">Registra al menos dos pesos para ver la evolución.</p>';
  const W=480,Hh=190,pl=44,pr=18,pt=18,pb=30;
  const mn=Math.floor((Math.min.apply(null,w)-0.4)*2)/2,mx=Math.ceil((Math.max.apply(null,w)+0.4)*2)/2;
  const x=i=>pl+(W-pl-pr)*i/(w.length-1),y=v=>pt+(Hh-pt-pb)*(1-(v-mn)/(mx-mn));
  const mid=(mn+mx)/2;
  const grid=[mn,mid,mx].map(v=>'<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="ax" x="'+(pl-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v.toFixed(1).replace('.',',')+'</text>').join('');
  const pts=w.map((v,i)=>x(i)+','+y(v)).join(' ');
  const area='M'+x(0)+','+y(mn)+' L'+pts.replace(/ /g,' L')+' L'+x(w.length-1)+','+y(mn)+' Z';
  const dots=w.map((v,i)=>'<circle class="pt'+(i===w.length-1?' last':'')+'" cx="'+x(i)+'" cy="'+y(v)+'" r="'+(i===w.length-1?5:3.5)+'"/>').join('');
  const lx=x(w.length-1),ly=y(w[w.length-1]);
  return '<svg class="chart" viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="Evolución del peso en kilos">'+grid+'<path class="ar" d="'+area+'"/><polyline class="ln" points="'+pts+'"/>'+dots+'<text class="lastv" x="'+lx+'" y="'+(ly-11)+'" text-anchor="end">'+w[w.length-1].toFixed(1).replace('.',',')+' kg</text><text class="ax" x="'+pl+'" y="'+(Hh-8)+'">Inicio</text><text class="ax" x="'+(W-pr)+'" y="'+(Hh-8)+'" text-anchor="end">Último</text></svg>';
}

function wSeries(c){

  const t0=S[0].ts,t1=S[S.length-1].ts,X=i=>t0&&t1>t0?l+(S[i].ts-t0)/(t1-t0)*(W-l-r):l+i*(W-l-r)/(w.length-1),Y=v=>t+(mx-v)/(mx-mn)*(Hh-t-b);

  const xi=[0,Math.round((S.length-1)/2),S.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  const xs=t0?xi.map(i=>'<text x="'+X(i).toFixed(1)+'" y="'+(Hh-8)+'" text-anchor="'+(i===0?'start':i===S.length-1?'end':'middle')+'" class="pg-a">'+dmy(new Date(S[i].ts))+'</text>').join(''):'';
  const pts=S.map((x,i)=>X(i).toFixed(1)+','+Y(x.y).toFixed(1));
  const area='M'+X(0).toFixed(1)+','+(Hh-b)+' L'+pts.join(' L')+' L'+X(S.length-1).toFixed(1)+','+(Hh-b)+' Z';

  return lg+'<svg class="wch'+(big?' big':'')+'" viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="Evolución del peso: de '+fmtN(w[0])+' a '+fmtN(L.y)+' kg">'+grid+xs+
   '<path d="'+area+'" class="pg-ar"/><polyline points="'+pts.join(' ')+'" fill="none" class="pg-l"/>'+vals+dots+

/* ---------- progresión del entrenamiento ---------- */
const e1rm=(kg,r)=>kg>0&&r>0?kg*(1+r/30):0;
function progData(c){
  const M={};
  c.log.slice().sort((a,b)=>a.ts-b.ts).forEach(l=>{
    if(!l.sets||!l.sets.length||l.u==='s')return;
    let b={v:-1,kg:0,r:0};l.sets.forEach(s=>{const v=e1rm(s[0],s[1]);if(v>b.v||(v===b.v&&s[1]>b.r))b={v,kg:s[0],r:s[1]}});
    (M[l.ex]||(M[l.ex]=[])).push({ts:l.ts,e:b.v,kg:b.kg,r:b.r,reps:Math.max.apply(null,l.sets.map(s=>s[1])),vol:l.sets.reduce((a,s)=>a+s[0]*s[1],0)});
  });
  return M;
}
const pVal=(S,x)=>S.every(y=>y.kg===0)?x.reps:Math.round(x.e*10)/10;
function lineChart(P,unit,lab){

  const W=Math.max(320,Math.min(640,(window.innerWidth||640)-70)),H=W<480?190:210,l=40,r=18,t=18,b=30,ys=P.map(p=>p.y),mn0=Math.min.apply(null,ys),mx0=Math.max.apply(null,ys),pad=Math.max(1,(mx0-mn0)*.15),mn=mn0-pad,mx=mx0+pad;
  const X=i=>l+i*(W-l-r)/(P.length-1),Y=v=>t+(mx-v)/(mx-mn)*(H-t-b);
  const grid=[0,.5,1].map(f=>{const v=mn+(mx-mn)*f;return '<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" class="pg-g"/><text x="'+(l-8)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end" class="pg-a">'+fmtN(Math.round(v))+'</text>'}).join('');
  const xs=[0,Math.floor((P.length-1)/2),P.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>'<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(i===0?'start':i===P.length-1?'end':'middle')+'" class="pg-a">'+dmy(new Date(P[i].x))+'</text>').join('');
  const pts=P.map((p,i)=>X(i).toFixed(1)+','+Y(p.y).toFixed(1)).join(' ');
  const area='M'+X(0).toFixed(1)+','+(H-b)+' L'+pts.split(' ').join(' L')+' L'+X(P.length-1).toFixed(1)+','+(H-b)+' Z';
  const last=P[P.length-1];
  return '<svg class="pgc" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(lab)+': de '+fmtN(P[0].y)+' a '+fmtN(last.y)+' '+unit+'">'+grid+xs+
   '<path d="'+area+'" class="pg-ar"/><polyline points="'+pts+'" fill="none" class="pg-l"/>'+
   P.map((p,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(i===P.length-1?5.5:3.5)+'" class="'+(i===P.length-1?'pg-pl':'pg-p')+'"><title>'+dmy(new Date(p.x))+': '+fmtN(p.y)+' '+unit+(p.t?' ('+p.t+')':'')+'</title></circle>').join('')+
   '<text x="'+(X(P.length-1)-8).toFixed(1)+'" y="'+(Y(last.y)-12).toFixed(1)+'" text-anchor="end" class="pg-v">'+fmtN(last.y)+' '+unit+'</text></svg>';

function spark(S){
  if(S.length<2)return '<span class="muted">—</span>';

  return '<svg class="spk" viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><polyline points="'+pts+'" fill="none"/></svg>';
}
function volBars(c){
  const weeks=[];for(let wo=-7;wo<=0;wo++){const a=dayStart(wo,0),b2=dayStart(wo+1,0);weeks.push({wo,v:c.log.filter(l=>l.ts>=a&&l.ts<b2).reduce((s,l)=>s+(l.sets||[]).reduce((x,y)=>x+y[0]*y[1],0),0)})}

  return '<svg class="pgv" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Volumen total por semana, últimas 8 semanas">'+weeks.map((w,i)=>{const h=w.v/mx*(H-46),x=l+i*bw+bw*.18,y=H-24-h;return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*.64).toFixed(1)+'" height="'+Math.max(2,h).toFixed(1)+'" rx="5" class="'+(w.wo===0?'pv-c':'pv-b')+'"><title>'+weekLabel(w.wo)+': '+fmtN(Math.round(w.v))+' kg</title></rect>'+(w.v?'<text x="'+(x+bw*.32).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle" class="pg-a">'+(w.v>=1000?fmtN(Math.round(w.v/100)/10)+'k':fmtN(Math.round(w.v)))+'</text>':'')+'<text x="'+(x+bw*.32).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" class="pg-a">'+(w.wo===0?'Esta':dmy(new Date(dayStart(w.wo,0))))+'</text>'}).join('')+'</svg>';
}
function progCard(c,coach){

  const sel=state.progEx==='-'?'':state.progEx&&M[state.progEx]?state.progEx:names[0];

  const row=I=>{const n=names[all.indexOf(I)],on=n===sel,S=I.s,f=S[0],L=S[S.length-1];
    let body='';
    if(on){const best=S.reduce((a,x)=>(I.bw?x.reps>a.reps:x.e>a.e)?x:a,S[0]),P=S.map(x=>({x:x.ts,y:pVal(S,x),t:I.bw?x.reps+' reps':fmtN(x.kg)+' kg × '+x.r}));

       '<div class="pg-ms"><div><span>'+(I.bw?'Mejor marca':'Mejor serie')+'</span><b>'+(I.bw?best.reps+' reps':fmtN(best.kg)+' kg × '+best.r)+'</b><em>'+dmy(new Date(best.ts))+'</em></div><div><span>'+'Al empezar'+'</span><b>'+fmtN(I.a)+' '+I.u+'</b><em>'+dmy(new Date(f.ts))+'</em></div><div><span>Ahora</span><b>'+fmtN(I.z)+' '+I.u+'</b><em>'+dmy(new Date(L.ts))+'</em></div></div></div>'}
    return '<li class="pg-it'+(on?' on':'')+'"><button type="button" class="pg-r" data-act="progEx" data-n="'+esc(n)+'" aria-expanded="'+on+'"><span class="pg-n"><b>'+esc(n)+'</b><small>'+S.length+(S.length===1?' sesión':' sesiones')+' · '+(S.length>1?fmtN(I.a)+' → ':'')+fmtN(I.z)+' '+I.u+'</small></span>'+spark(S)+chip(I)+'<span class="pg-cv" aria-hidden="true">›</span></button>'+body+'</li>'};

  return '<section class="card pgcard"><h2 style="margin:0">'+title+'</h2><p class="muted" style="margin:4px 0 14px;font-size:13.5px">Toca un ejercicio para ver su gráfica.</p>'+sum+
   '<ul class="pg-list">'+(state.progAll||all.length<=7?all:all.slice(0,6).concat(all.slice(6).filter(I=>names[all.indexOf(I)]===sel))).map(row).join('')+'</ul>'+(all.length>7?'<button type="button" class="btn pg-more" data-act="progAll">'+(state.progAll?'Ver menos':'Ver los '+all.length+' ejercicios')+'</button>':'')+help+'</section>'+vol;
}

function comp(c){if(!c.comp)c.comp={nac:'',sexo:'',altura:c.diet.altura||'',notas:'',revs:[]};while(c.comp.revs.length<CC_N)c.comp.revs.push({fecha:'',v:{}});return c.comp}
function ccVal(c,i,k){
  const C=comp(c),v=C.revs[i].v,alt=num(C.altura),p=num(v.peso),g=x=>v[x]===''||v[x]==null?null:ccPct(x,num(v[x]));

    case 'altura':return p&&alt?alt:null;

const ccFmt=(k,x)=>x==null||isNaN(x)?'':k==='icc'||k==='ica'?x.toFixed(2).replace('.',','):k==='tmb'||k==='visc'||k==='edadm'||k==='altura'?fmtN(Math.round(x)):fmtN(Math.round(x*10)/10);

function ccEval(c){

function multiLine(title,unit,series,labels){

  const X=i=>l+(n<2?0:i*(W-l-r)/(n-1)),Y=v=>t+(mx-v)/(mx-mn)*(H-t-b);
  const grid=[0,.5,1].map(f=>{const v=mn+(mx-mn)*f;return '<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" class="pg-g"/><text x="'+(l-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end" class="pg-a">'+fmtN(Math.round(v*10)/10)+'</text>'}).join('');

function holdMark(){const r=HOLDOK;HOLDOK=null;const ok=r&&r.isConnected&&r.querySelector('.setok');if(ok&&!ok.checked&&!ok.disabled){ok.checked=true;ok.dispatchEvent(new Event('change',{bubbles:true}))}}

let AC=null;
function beep(n){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const play=()=>{for(let k=0;k<n;k++){const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+.05+k*.3;o.frequency.value=880;g.gain.setValueAtTime(.4,t0);g.gain.exponentialRampToValueAtTime(.001,t0+.22);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+.25)}};
  /* iOS deja el audio «suspended»/«interrupted» tras bloquear o cambiar de app: se reanuda y luego suena */
  if(AC.state!=='running')AC.resume().then(play,()=>{});else play()}catch(_){}}
/* cualquier toque reactiva el audio, así el pitido final no depende de haber pulsado ⏱ */
document.addEventListener('pointerdown',()=>{if(!AC||AC.state!=='running')beep(0)},{passive:true});
/* pantalla encendida mientras corre un temporizador (si el móvil lo permite) */
let WL=null;
function wakeOn(){try{if(!WL&&navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>{WL=w;w.addEventListener('release',()=>{if(WL===w)WL=null})},()=>{})}catch(_){}}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&RT)wakeOn()});
/* encadenar (isométricos): al acabar el descanso, aviso de 3 s y empieza solo la siguiente serie */
function holdGo(row){const rp=row.querySelector('.setreps'),sec=parseInt(rp.value||rp.dataset.t)||30,ex=row.closest('.exo'),u=ex&&ex.dataset.uni;
  if(!u){restStart(sec,'Aguanta','¡Tiempo! Serie hecha',1,row);return}
  /* unilateral: un lado, 5 s para cambiar y el otro lado; la serie se marca al acabar el segundo */
  const L=u==='lado'?['Lado 1','Lado 2']:[u[0].toUpperCase()+u.slice(1)+' 1',u[0].toUpperCase()+u.slice(1)+' 2'];
  restStart(sec,'Aguanta · '+L[0],0,0,null,()=>{beep(2);try{navigator.vibrate&&navigator.vibrate(200)}catch(_){}
    restStart(5,'Cambia de '+u,0,0,null,()=>{if(row.isConnected){beep(1);restStart(sec,'Aguanta · '+L[1],'¡Tiempo! Serie hecha',1,row)}})})}
function chainNext(sel){const ex=$(sel),row=ex&&$$('.setrow2',ex).find(r=>{const o=r.querySelector('.setok');return o&&!o.checked&&!o.disabled});if(!row)return;
  beep(1);restStart(3,'Siguiente serie en',null,0,null,()=>{if(row.isConnected){beep(1);holdGo(row)}})}
function restStart(sec,label,doneTxt,snd,row,then){
  holdMark();restStop(1);HOLD=row||null;if(!(sec>0))return;
  let el=$('#rt');
  if(!el){el=document.createElement('div');el.id='rt';el.className='rt';el.setAttribute('role','timer');document.body.appendChild(el);
    el.innerHTML='<span class="rt-l">Descanso</span><b class="rt-v" aria-live="off"></b><button type="button" class="rt-b" data-act="rtAdd" data-v="-15" aria-label="Restar 15 segundos">−15</button><button type="button" class="rt-b" data-act="rtAdd" data-v="15" aria-label="Sumar 15 segundos">+15</button><button type="button" class="rt-b rt-x" data-act="rtStop" aria-label="Cerrar temporizador">✕</button><i class="rt-bar"><i></i></i>'}
  el.hidden=false;el.classList.remove('done');$('.rt-l',el).textContent=label||'Descanso';
  RT={end:Date.now()+sec*1000,tot:sec,int:0};wakeOn();
  const tick=()=>{if(!RT)return;const left=Math.max(0,Math.ceil((RT.end-Date.now())/1000));$('.rt-v',el).textContent=mmss(left);$('.rt-bar i',el).style.width=(100-left/RT.tot*100)+'%';
    if(left<=0){clearInterval(RT.int);RT=null;if(then){then();return}HOLDOK=HOLD;HOLD=null;el.classList.add('done');$('.rt-l',el).textContent=doneTxt||'¡A por la siguiente!';beep(3);wakeOff();
      try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(_){}
      setTimeout(()=>{if(!RT){const e=$('#rt');if(e)e.hidden=true;holdMark()}},HOLDOK&&HOLDOK.closest('[data-chain]')?1500:4000)}};
  RT.int=setInterval(tick,250);tick();
}

function suggest(c,e,wi){
  const W=c.training.meso.weeks[wi]||{},rirT=num(W.rir),base=num(e.kg),reps=parseInt(e.reps)||0,deload=/descarga/i.test(W.phase||''),sets0=parseInt(e.sets)||3;
  const out={kg:base,reps,rir:rirT,sets:sets0,why:'',tag:''};
  const eqC=eqCur(c,e.name),eqP=l=>!eqC||(l.eq||eqDef(e.name))===eqC;
  if(eqC&&eqC!==eqDef(e.name)&&!c.log.some(l=>l.ex===e.name&&l.eq===eqC&&!(l.exId===e.id&&l.w===wi)&&l.sets&&l.sets.length)){if(e.wk&&e.wk[wi]&&e.wk[wi].sets)out.sets=parseInt(e.wk[wi].sets)||sets0;out.kg=0;out.why='Con '+eqC.toLowerCase()+': elige el peso de cada una que te deje el RIR objetivo.';return out}
  const PW=eqC&&eqC!==eqDef(e.name)?null:e.wk&&e.wk[wi];
  if(PW){
    if(PW.sets)out.sets=parseInt(PW.sets)||sets0;
    if(PW.kg!=null&&PW.kg!==''){const k=num(PW.kg);if(k>0&&/^[\d.,\s]*(kg)?$/i.test(String(PW.kg).trim()))out.kg=k;else{out.kg=0;out.kgTxt=String(PW.kg)}}
    out.tag='coach';out.why=PW.why||(/rir/i.test(out.kgTxt||'')?'Elige el peso que te deje justo el RIR objetivo de esta semana.':/corporal/i.test(out.kgTxt||'')?'Con tu propio peso corporal.':deload?'Semana de descarga: menos series y menos peso, ya ajustado por tu entrenador. Termina fresca/o, lejos del fallo.':'Carga pautada por tu entrenador para esta semana. Puedes llegar a ella subiendo en las primeras series.');
    return out;
  }
  const RR=String(e.reps||'').match(/(\d+)\s*[-–]\s*(\d+)/),lo=RR?+RR[1]:reps,hi=RR?+RR[2]:reps;
  const rnd=(v,ref)=>ref>=20?Math.round(v/2.5)*2.5:Math.round(v*2)/2;
  const prev=c.training.auto===false?null:c.log.filter(l=>l.ex===e.name&&eqP(l)&&!(l.exId===e.id&&l.w===wi)&&l.sets&&l.sets.length).sort((a,b)=>b.ts-a.ts)[0];
  if(prev&&reps){
    const bw=prev.sets.every(s=>!(s[0]>0)),top=Math.max.apply(null,prev.sets.map(s=>s[0])),hit=prev.sets.every(s=>s[1]>=hi),miss=prev.sets.some(s=>s[1]<=lo-2),pr=prev.rir,easy=pr==null||pr>=rirT;

    else if(miss){out.kg=rnd(top*.95,top);out.tag='down';out.why='Te faltaron repeticiones ('+sum+'). Baja un poco y haz todas las reps con buena técnica.'}
    else{out.kg=top;out.tag='keep';out.why='Casi completas ('+sum+'). Repite el peso hasta sacar todas las reps.'}

  return out;
}

const rPace=(min,km)=>{if(!(min>0&&km>0))return '';const p=min/km,m=Math.floor(p),s=Math.round((p-m)*60);return (s===60?(m+1)+':00':m+':'+String(s).padStart(2,'0'))+' /km'};

}

function notifItems(){
  const out=[];
  state.clients.forEach(c=>{
    c.msgs.filter(m=>m.fresh&&m.from==='client').forEach(m=>out.push({c,ts:m.ts,t:'mensajes',title:m.kind,text:m.text}));
    const ph=c.photos.filter(p=>p.fresh);if(ph.length)out.push({c,ts:Math.max.apply(null,ph.map(p=>p.ts)),t:'fotos',title:'Fotos nuevas',text:'Ha subido '+ph.length+(ph.length===1?' foto':' fotos')});
    if(c.shotNoCredit)out.push({c,ts:c.shotNoCredit,t:'resumen',title:'⚠ Lector de capturas sin saldo',text:'Recarga saldo en console.anthropic.com (Billing). Mientras, se apuntan a mano.'});
    const lg2=c.log.filter(l=>l.fresh);if(lg2.length)out.push({c,ts:Math.max.apply(null,lg2.map(l=>l.ts)),t:'registro',title:'Entreno registrado',text:lg2.length+(lg2.length===1?' ejercicio nuevo':' ejercicios nuevos')});
    revNotif(c,out);
    {const fo=(c.acts||[]).filter(x=>x.fresh&&isOut(x));if(fo.length){const z=fo[fo.length-1];out.push({c,ts:z.ts,t:'carrera',title:fo.length===1?'Salida por su cuenta':fo.length+' salidas por su cuenta',text:fo.map(a=>a.type+(actSum(a)?' '+actSum(a):'')).join(' · ')})}}
    {const fa=(c.acts||[]).filter(x=>x.fresh&&!isOut(x));if(fa.length){const z=fa[fa.length-1];out.push({c,ts:z.ts,t:'seguimiento',title:'Otra actividad',text:fa.map(a=>(a.type==='Otra'&&a.other?a.other:a.type)+(actSum(a)?' '+actSum(a):'')).join(' · ')})}}
    if(c.run){const rl=(c.run.logs||[]).filter(x=>x.fresh);if(rl.length){const z=rl.slice().sort((a,b)=>b.ts-a.ts)[0],pn=rl.filter(x=>x.pain>=3);out.push({c,ts:z.ts,t:'carrera',title:pn.length?'⚠️ Dolor en carrera':'Salida registrada',text:pn.length?'Dolor '+pn[0].pain+'/10'+(pn[0].painZ?' · '+pn[0].painZ:''):(z.st==='no'?'No ha podido hacer la sesión':[z.min?rHM(z.min):'',z.km?fmtN(z.km)+' km':'',rPace(z.min,z.km)].filter(Boolean).join(' · ')||RUN_ST[z.st][1])})}}
    const ck=c.chk.filter(x=>x.fresh);if(ck.length)out.push({c,ts:Math.max.apply(null,ck.map(x=>x.ts)),t:'seguimiento',title:'Pesaje semanal',text:'Ha registrado '+fmtN(ck[ck.length-1].peso)+' kg'+(ck[ck.length-1].comm?' · '+ck[ck.length-1].comm:'')});
  });
  return out.sort((a,b)=>b.ts-a.ts);
}

function postRender(c){
  if(state.mode!=='coach'||!c)return;
  let ch=false;
  if(state.tab==='mensajes')c.msgs.forEach(m=>{if(m.fresh){m.fresh=false;ch=true}});
  if(state.tab==='fotos')c.photos.forEach(p=>{if(p.fresh){p.fresh=false;ch=true}});
  if(state.tab==='resumen'&&c.shotNoCredit){delete c.shotNoCredit;ch=true}
  if(state.tab==='seguimiento')c.chk.forEach(x=>{if(x.fresh){x.fresh=false;ch=true}});
  if(state.tab==='seguimiento')(c.acts||[]).forEach(x=>{if(x.fresh&&!isOut(x)){x.fresh=false;ch=true}});
  if(state.tab==='carrera')(c.acts||[]).forEach(x=>{if(x.fresh&&isOut(x)){x.fresh=false;ch=true}});
  if(state.tab==='carrera'&&c.run)(c.run.logs||[]).forEach(x=>{if(x.fresh){x.fresh=false;ch=true}});
  if(ch)updateBadges();else renderBell();
}

}

function psDayTable(c,t){
  const ty=c.diet.types[t],seen=new Set(),rows=[];let K=0,P=0,H=0,G=0;
  const row=(label,m)=>{
    let k=0,p=0,h=0,g=0,foods='';

  };

const REV_AVISO=7;   // días antes de la revisión en los que empieza a avisar

function revParse(s){
  s=String(s||'').trim().toLowerCase();if(!s||s==='—'||s==='-')return '';
  let m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);if(m)return revIsoOf(+m[1],m[2]-1,+m[3]);
  m=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})$/.exec(s);if(m)return revIsoOf(m[3].length===2?2000+(+m[3]):+m[3],m[2]-1,+m[1]);

  if(m&&m[2] in REV_MES){const mo=REV_MES[m[2]],d=+m[1];if(m[3])return revIsoOf(+m[3],mo,d);

  return '';

const revIso=c=>c.revDate||revParse(c.review);

/* estado: none (sin fecha) · done (ya hecha, falta la siguiente) · late (vencida) · today · soon (≤ REV_AVISO días) · later */
function revSt(c){

      const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),cv=document.createElement('canvas');
      cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);
      cv.toBlob(b=>res(b&&b.size<blob.size?b:blob),'image/jpeg',.85);
    };
    img.onerror=()=>{URL.revokeObjectURL(u);res(blob)};
    img.src=u;
  });
}
async function uploadBlobs(obj,folder){
  const jobs=[];walk(obj,(h,k,v)=>{if(v.indexOf('blob:')===0)jobs.push([h,k,v])});
  for(const[h,k,u]of jobs){
    try{
      let b=await (await fetch(u)).blob();
      b=await shrink(b,k==='avatar'?600:1800);
      const ext=(b.type.split('/')[1]||'bin').replace('jpeg','jpg').replace(/[^a-z0-9]/g,'').slice(0,5)||'bin';
      const path=folder+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)+'.'+ext;
      const{error}=await sb.storage.from('media').upload(path,b,{contentType:b.type||'application/octet-stream',upsert:false});
      if(error)throw error;
      RB.media['sb:'+path]={url:u,exp:Infinity};
      if(h[k]===u)h[k]='sb:'+path;
      if(state.mAtt===u)state.mAtt='';
    }catch(e){console.warn('subida',e);setSync('err','No se ha podido subir un archivo');throw e}
  }
}
async function removeFolder(folder){
  try{const{data}=await sb.storage.from('media').list(folder,{limit:1000});if(data&&data.length)await sb.storage.from('media').remove(data.map(f=>folder+'/'+f.name))}catch(e){console.warn(e)}

async function saveNow(){
  if(!RB.role)return;

  RB.saving=true;let did=false;
  try{
    for(const c of state.clients.slice()){if(await saveClient(c))did=true}
    if(RB.role==='coach'){if(await saveApp('tpls',state.tpls))did=true;if(await saveApp('lib',state.lib))did=true}
    RB.err=0;if(did)setSync('ok');
  }catch(e){
    console.error(e);RB.err++;
    setSync(navigator.onLine===false?'off':'err');
    clearTimeout(RB.timer);RB.timer=setTimeout(saveNow,Math.min(30000,3000*RB.err));
  }finally{RB.saving=false}

async function saveClient(c){
  const B=RB.base[c.id];if(!B||B.creating)return false;
  autoVersion(c,B);
  let d=diff(c,B.s);if(!d.n)return false;
  if(RB.role==='client'&&Object.keys(d.patch).concat(d.rem).some(k=>['actTs','cSeen','planSeen','likeSeen'].indexOf(k)<0)){c.actTs=Date.now();d=diff(c,B.s)}
  setSync('saving');
  await uploadBlobs(c,c.id);
  for(let i=0;i<5;i++){
    d=diff(c,B.s);if(!d.n)return true;
    const{data:v,error}=await sb.rpc('save_client',{p_id:c.id,p_patch:d.patch,p_remove:d.rem,p_ver:B.ver});
    if(error)throw error;
    if(v!=null){B.ver=v;Object.assign(B.s,d.snaps);d.rem.forEach(k=>delete B.s[k]);return true}
    const{data:r,error:e2}=await sb.from('clients').select('id,email,ver,data'+(RB.role==='coach'?',user_id':'')).eq('id',c.id).maybeSingle();
    if(e2)throw e2;

}
async function saveApp(key,val){
  if(val===undefined)return false;

    if(error&&error.code!=='23505')throw error;
    if(!error){A.ver=1;A.s=j2;return true}

async function poll(){

    }

async function createAccount(cid,em,pw){

  const{data,error}=await tmp.auth.signUp({email:em,password:pw});
  if(error){toast('Cliente creado, pero falta su acceso: '+error.message);return false}
  const B=RB.base[cid];if(B&&data&&data.user)B.uid=data.user.id;
  RB.lastPw[cid]=pw;if(state.sel===cid){state.tab='datos'}return true;
}
function welcomeMsg(c,pw){
  const B=RB.base[c.id]||{};
  return '¡Hola '+first(c.name)+'! Ya tienes tu acceso a Team Biscuit 💪\n\nEntra aquí: '+location.origin+location.pathname.replace(/index\.html$/,'')+'\nEmail: '+(B.email||'')+'\nContraseña: '+pw+'\n\nConsejo: guárdala en la pantalla de inicio del móvil (en el navegador, «Añadir a pantalla de inicio») y la tendrás como una app.';
}

async function accSave(c){
  const pw=($('#accPw')&&$('#accPw').value.trim())||'';const B=RB.base[c.id]||{};
  if(pw.length<8){toast('Mínimo 8 caracteres');return}
  if(B.uid){
    const{error}=await sb.rpc('coach_set_password',{p_client:c.id,p_pass:pw});
    if(error){toast(error.message);return}
    RB.lastPw[c.id]=pw;
  }else if(!(await createAccount(c.id,B.email,pw)))return;
  RB.pwFor='';renderMain();toast('Contraseña guardada');
}
async function delClient(id){
  try{const{error}=await sb.rpc('coach_delete_client',{p_client:id});if(error)throw error;await removeFolder(id);delete RB.base[id]}
  catch(e){console.error(e);toast('No se ha podido eliminar en el servidor');poll()}
}
/* ---------- eliminar cliente: perfil completo en Word + cuenta atrás ---------- */
const PF_L={name:'Nombre',goal:'Objetivo',phase:'Fase',review:'Revisión',date:'Fecha',type:'Tipo',other:'Otra',min:'Minutos',km:'Km',hr:'FC media',hrmax:'FC máx.',rpe:'Esfuerzo (RPE)',pain:'Dolor',painZ:'Zona de dolor',note:'Nota',notes:'Notas',st:'Estado',ts:'Fecha',w:'Semana',i:'Sesión',sets:'Series',reps:'Reps',kg:'Kg',rest:'Descanso (s)',tempo:'Tempo',tech:'Técnica',rir:'RIR',focus:'Enfoque',dur:'Duración',place:'Lugar',warm:'Calentamiento',phaseN:'Fase',vol:'Volumen',int:'Intensidad',text:'Texto',kind:'Tipo',from:'De',label:'Etiqueta',ex:'Ejercicio',day:'Día',eq:'Material',pr:'Récord',edited:'Corregido',img:'Captura'};
const pfLab=k=>PF_L[k]||String(k).replace(/([a-z])([A-Z])/g,'$1 $2').replace(/^./,x=>x.toUpperCase());
const pfSkip=k=>k==='id'||k==='fresh';
function pfVal(v){
  if(v==null||v==='')return '';
  if(typeof v==='boolean')return v?'Sí':'No';
  if(typeof v==='number')return v>1e12&&v<4e12?cDate(v):fmtN(v);
  if(typeof v==='string')return v.indexOf('sb:')===0||v.indexOf('blob:')===0?'(archivo guardado en la app)':v;
  if(Array.isArray(v))return v.map(pfVal).filter(Boolean).join(Array.isArray(v[0])?' · ':', ');
  return Object.keys(v).filter(k=>!pfSkip(k)).map(k=>{const x=pfVal(v[k]);return x?pfLab(k)+': '+x:''}).filter(Boolean).join(' · ');
}
/* cualquier dato sin sección propia: así no se queda nada fuera */
function pfGen(B,title,v,lv){
  if(v==null||v===''||(typeof v==='object'&&!pfVal(v)))return;
  if(typeof v!=='object'){B.push(['kv',[[title,pfVal(v)]]]);return}
  B.push(['h',lv,title]);
  if(Array.isArray(v)){
    if(v.every(x=>x&&typeof x==='object'&&!Array.isArray(x))){
      const ks=[];v.forEach(x=>Object.keys(x).forEach(k=>{if(!pfSkip(k)&&ks.indexOf(k)<0)ks.push(k)}));
      B.push(['t',ks.map(pfLab),v.map(x=>ks.map(k=>pfVal(x[k])))]);
    }else B.push(['p',pfVal(v)]);
    return;
  }
  const kv=[],sub=[];
  Object.keys(v).forEach(k=>{if(pfSkip(k))return;const x=v[k];if(x&&typeof x==='object'&&!(Array.isArray(x)&&x.every(y=>y==null||typeof y!=='object')))sub.push(k);else kv.push([pfLab(k),pfVal(x)])});
  if(kv.length)B.push(['kv',kv]);
  sub.forEach(k=>pfGen(B,pfLab(k),v[k],Math.min(3,lv+1)));
}
function pfDiet(B,d,lv){
  if(!d)return;
  B.push(['kv',[['Edad',d.edad],['Altura (cm)',d.altura],['Nivel de actividad',d.nivel],['Duración',d.dur],['Inicio',d.inicio],['Días de entreno',(d.trainDays||[]).map((x,i)=>x?DAYS[i]:'').filter(Boolean).join(', ')],['Agua (l/día)',d.water],['Peso objetivo (kg)',d.goalW],['Metabolismo basal (kcal)',d.bmr],['Gasto total (kcal)',d.tdee],['Notas',d.notes]].map(r=>[r[0],pfVal(r[1])])]);
  [['train','Día de entrenamiento'],['rest','Día de descanso']].forEach(([t,n])=>{const T=d.types&&d.types[t];if(!T)return;
    B.push(['h',lv,n+(T.kcal?' · '+Math.round(T.kcal)+' kcal':'')+(T.p?' · '+Math.round(T.p)+' g proteína':'')]);
    (T.meals||[]).forEach(m=>{const it=m.items||[],k=it.reduce((a,i)=>a+kc(i),0);
      B.push(['p',(m.time?m.time+' · ':'')+m.name+' ('+Math.round(k)+' kcal)'+(m.note?'\n'+m.note:'')]);
      B.push(['t',['Alimento','Gramos','Proteína','Hidratos','Grasas','Kcal','Alternativa'],it.map(i=>[i.food,pfVal(i.g),pfVal(i.p),pfVal(i.c),pfVal(i.f),Math.round(kc(i)),pfVal(i.alt)])])});
  });
  if((d.supps||[]).length){B.push(['h',lv,'Suplementación']);B.push(['t',['Suplemento','Dosis','Cuándo','Observaciones'],d.supps.map(x=>[x.name,x.dose,x.when,x.obs])])}
  const rest={};Object.keys(d).forEach(k=>{if(['edad','altura','nivel','dur','inicio','trainDays','water','goalW','bmr','tdee','notes','types','supps'].indexOf(k)<0)rest[k]=d[k]});
  if(Object.keys(rest).length)pfGen(B,'Otros datos de la dieta',rest,lv);
}
function pfTrain(B,t,run,lv){
  if(t){
    const M=t.meso||{};
    B.push(['kv',[['Mesociclo',M.n],['Nivel',M.level],['Inicio',M.start]].map(r=>[r[0],pfVal(r[1])])]);
    if((M.weeks||[]).length)B.push(['t',['Semana','Fase','RIR','Volumen','Intensidad','Notas'],M.weeks.map((w,i)=>[i+1,w.phase,pfVal(w.rir),w.vol,w.int,w.notes])]);
    (t.days||[]).forEach(d=>{
      B.push(['h',lv,d.name+(d.focus?' · '+d.focus:'')]);
      B.push(['kv',[['Día de la semana',d.wd>=0&&d.wd<7?DAYS[d.wd]:''],['Duración (min)',d.dur],['Lugar',d.place],['Calentamiento',d.warm],['Nota',d.note]].map(r=>[r[0],pfVal(r[1])])]);
      const ks=[];(d.exs||[]).forEach(x=>Object.keys(x).forEach(k=>{if(!pfSkip(k)&&ks.indexOf(k)<0)ks.push(k)}));
      if(ks.length)B.push(['t',ks.map(pfLab),d.exs.map(x=>ks.map(k=>pfVal(x[k])))]);
      const o={};Object.keys(d).forEach(k=>{if(['id','name','focus','wd','dur','place','warm','note','exs'].indexOf(k)<0)o[k]=d[k]});if(Object.keys(o).length)pfGen(B,'Más datos de '+d.name,o,3);
    });
    const o={};Object.keys(t).forEach(k=>{if(k!=='meso'&&k!=='days')o[k]=t[k]});if(Object.keys(o).length)pfGen(B,'Otros datos del entrenamiento',o,lv);
  }
  if(run){const r=Object.assign({},run);delete r.logs;pfGen(B,'Plan de carrera',r,lv)}
}
async function pfPhoto(x){
  const b=await (await fetch(await fileURL(x))).blob(),im=await createImageBitmap(b),k=Math.min(1,1400/Math.max(im.width,im.height));
  const cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
  const j=await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));return new Uint8Array(await j.arrayBuffer());
}
async function perfilDoc(c){
  const B=[],imgs=[],base=RB.base[c.id]||{},done=['id','name','goal','phase','review','revDate','track','consent','int','comp','chk','weights','adh','hab','eat','eatWk','diet','training','run','log','acts','msgs','planHist','planSince','planEd','photos'];

      else if(a==='steps'){fl();used.steps=1;B.push(['t',['Siguientes pasos','Estado'],INT_STEPS.map(s=>[s,(I.steps||[]).indexOf(s)>=0?'✓ Hecho':'Pendiente'])])}
    });fl();
    const o={};Object.keys(I).forEach(k=>{if(!used[k])o[k]=I[k]});if(Object.keys(o).length)pfGen(B,'Otros datos de la ficha',o,2);
  }
  if(c.comp){const C=JSON.parse(JSON.stringify(c.comp)),cl=Object.assign({},c,{comp:C});
    B.push(['pb']);B.push(['h',1,'Revisiones · composición corporal']);
    B.push(['kv',[['Fecha de nacimiento',C.nac],['Sexo',C.sexo],['Altura (cm)',C.altura],['Notas',C.notas]].map(r=>[r[0],pfVal(r[1])])]);
    const idx=(C.revs||[]).map((r,i)=>i).filter(i=>C.revs[i].fecha||Object.keys(C.revs[i].v||{}).length);

        CC_ROWS.map(R=>R[0]==='h'?[R[1]].concat(part.map(()=>'')):[R[1]].concat(part.map(i=>{let v;try{v=R[2]==='calc'?ccVal(cl,i,R[0]):C.revs[i].v[R[0]]}catch(_){v=null}return v==null||v===''||(typeof v==='number'&&!isFinite(v))?'':pfVal(typeof v==='number'?Math.round(v*100)/100:v)})))]);
    }

  B.push(['pb']);B.push(['h',1,'Seguimiento']);

  B.push(['pb']);B.push(['h',1,'Plan nutricional actual']);pfDiet(B,c.diet,2);

  ['diet','training'].forEach(k=>{const L=histOf(c,k);if(!L.length)return;

async function pwSave(t){
  const box=t.closest('.pf-pw'),ins=box?box.querySelectorAll('input'):[],cur0=ins[0]?ins[0].value:'',nw=ins[1]?ins[1].value:'';
  if(nw.length<8){toast('La nueva contraseña debe tener al menos 8 caracteres');return}
  t.disabled=true;
  const{error:e1}=await sb.auth.signInWithPassword({email:RB.user.email,password:cur0});
  if(e1){t.disabled=false;toast('La contraseña actual no es correcta');return}
  const{error}=await sb.auth.updateUser({password:nw});
  t.disabled=false;
  if(error){toast('No se ha podido cambiar: '+error.message);return}
  state.pwOpen=false;renderMain();toast('Contraseña cambiada ✓');
}
function download(name,text){
  const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:'application/json'}));
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Datos descargados');
}
document.addEventListener('click',e=>{

let PYO=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('No se pudo cargar '+src));document.head.appendChild(s)})}
function pyImporter(){
  if(PYO)return PYO;
  PYO=(async()=>{
    const base=new URL('vendor/pyodide/',location.href).href;
    if(!window.loadPyodide)await loadScript(base+'pyodide.js');
    const py=await loadPyodide({indexURL:base});
    await py.loadPackage(['lxml','typing-extensions',base+'et_xmlfile-2.0.0-py3-none-any.whl',base+'openpyxl-3.1.5-py2.py3-none-any.whl',base+'python_docx-1.2.0-py3-none-any.whl']);
    const get=async u=>{const r=await fetch(u,{cache:'no-cache'});if(!r.ok)throw new Error(u);return r.text()};
    const [code,foods]=await Promise.all([get('vendor/importer/importer.py'),get('vendor/importer/foods.json')]);
    ['/tb','/tb/tools','/tb/src','/in'].forEach(d=>{try{py.FS.mkdir(d)}catch(_){}});
    py.FS.writeFile('/tb/tools/importer.py',code);py.FS.writeFile('/tb/src/foods.json',foods);
    py.runPython('import sys, warnings\nwarnings.filterwarnings("ignore")\nsys.path.insert(0, "/tb/tools")\nimport importer');
    return py})();
  PYO.catch(()=>{PYO=null});
  return PYO;
}
const IMP_K={plan:'Plan nutricional',entreno:'Entrenamiento',carrera:'Plan de carrera',comp:'Composición corporal',ficha:'Ficha inicial'};
async function officeImport(files){
  const py=await pyImporter();
  try{py.FS.readdir('/in').forEach(f=>{if(f!=='.'&&f!=='..')py.FS.unlink('/in/'+f)})}catch(_){}
  const paths=[];
  for(let i=0;i<files.length;i++){const f=files[i],ext=(f.name.match(/\.(docx|xlsx|xlsm)$/i)||[])[1];if(!ext)continue;const p='/in/'+i+'.'+ext.toLowerCase();py.FS.writeFile(p,new Uint8Array(await f.arrayBuffer()));paths.push([p,f.name])}
  py.globals.set('_paths',py.toPy(paths));
  const out=py.runPython(`
import json, importer
K, dup, names = {}, [], {}
for p, n in _paths:
    try: k = importer.classify(p)
    except Exception as e: k = None
    if not k: continue
    if k in K: dup.append(n); continue
    K[k] = p; names[k] = n
try:
    o, rep = importer.build(K.get('plan'), K.get('entreno'), K.get('carrera'), K.get('comp'), K.get('ficha'))
    err = ''
except Exception as e:
    o, rep, err = None, [], '%s: %s' % (type(e).__name__, e)
json.dumps({'j': o, 'rep': rep, 'kinds': names, 'dup': dup, 'err': err}, ensure_ascii=False)
`);
  return JSON.parse(out);
}

function syncLib(){
  if(!Array.isArray(state.lib))return;
  const names=new Set(state.lib.map(l=>String(l.name||'').toLowerCase()));
  LIB_DEF.forEach(d=>{if(!names.has(d.name.toLowerCase()))state.lib.push(Object.assign({},d,{id:nid()}))});
  // los ejercicios de los planes que aún no están en la biblioteca se añaden solos (para poder ponerles foto o vídeo)
  if(RB.role==='coach')(state.clients||[]).forEach(c=>((c.training&&c.training.days)||[]).forEach(d=>(d.exs||[]).forEach(e=>{const n=String(e.name||'').trim();if(!n||names.has(n.toLowerCase()))return;names.add(n.toLowerCase());
    const g=libGroupOf(n);
    state.lib.push({id:nid(),group:g,name:n,mat:'',photo:'',video:'',link:''})})));
  state.lib.forEach(L=>{if(!L.group||L.group==='Otros'){const g=libGroupOf(L.name||'');if(g!=='Otros')L.group=g}});
  state.lib.forEach(L=>{const id=fedbOf(L.name);if(id&&(!L.photo||String(L.photo).indexOf('data:')===0||(/^ex\//.test(L.photo)&&L.photo!==fedbPath(id))))L.photo=fedbPath(id)});
}

/* ---------- imprimir en la app del iPhone (pantalla de inicio): window.print no funciona → PDF ---------- */
const IOS_PWA=navigator.standalone===true||/[?&]pdftest=1/.test(location.search);
let h2pP=null;
function ldS(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ko(new Error('load'));document.head.appendChild(s)})}
function h2p(){return h2pP||(h2pP=ldS('vendor/html2canvas-pro.min.js').then(()=>ldS('vendor/html2pdf.min.js')).then(()=>window.html2pdf,e=>{h2pP=null;throw e}))}
async function pdfSheet(html){
  const ov=document.createElement('div');ov.className='pdfov';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');
  ov.innerHTML='<div class="pdf-box"><div class="lg-spin"></div><p><b>Preparando el PDF…</b></p><p class="muted">Tarda unos segundos.</p></div>';document.body.appendChild(ov);
  const box=document.createElement('div');box.id='pdfroot';box.innerHTML='<div class="pdfx">'+html+'</div>';document.body.appendChild(box);
  const pcss=[];for(const sh of document.styleSheets){let rs;try{rs=sh.cssRules}catch(_){continue}for(const r of rs){if(r.media&&/print/.test(r.media.mediaText))for(const x of r.cssRules){if(x.selectorText&&x.selectorText.indexOf('#printroot')>=0)pcss.push(x.cssText.replace(/#printroot/g,'.pdfx'))}}}
  const pst=document.createElement('style');pst.textContent=pcss.join('\n');document.head.appendChild(pst);
  const root=document.documentElement,th=root.getAttribute('data-theme');root.setAttribute('data-theme','light');
  const back=()=>{pst.remove();if(th==null)root.removeAttribute('data-theme');else root.setAttribute('data-theme',th)};
  const close=()=>{ov.remove()};
  try{
    const lib=await h2p();
    await new Promise(r=>setTimeout(r,60));
    const t=(box.querySelector('h2')||{}).textContent||'Team Biscuit';
    const name=(t.trim().replace(/[^\wÁÉÍÓÚÑÜáéíóúñü ·-]/g,'').slice(0,40)||'Team Biscuit')+'.pdf';
    const blob=await lib().set({margin:[8,8,10,8],filename:name,image:{type:'jpeg',quality:.92},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css'],avoid:['tr','.ps-sec','.sh-box','.xg','.iv-row','.supp-i']}}).from(box.firstElementChild).outputPdf('blob');
    box.remove();back();
    const file=new File([blob],name,{type:'application/pdf'});
    ov.innerHTML='<div class="pdf-box"><p class="pdf-ic" aria-hidden="true">📄</p><p><b>PDF listo</b></p><p class="muted">Ábrelo y desde el botón de compartir podrás imprimirlo, guardarlo en Archivos o enviarlo.</p><div class="actions"><button type="button" class="btn primary" id="pdfGo">Abrir PDF</button><button type="button" class="btn" id="pdfX">Cerrar</button></div></div>';
    ov.querySelector('#pdfX').onclick=close;
    ov.querySelector('#pdfGo').onclick=()=>{
      if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).then(close,()=>{})}
      else{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.target='_blank';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);close()}
    };
  }catch(e){
    box.remove();back();
    ov.innerHTML='<div class="pdf-box"><p><b>No se pudo preparar el PDF</b></p><p class="muted">Comprueba la conexión e inténtalo de nuevo.</p><div class="actions"><button type="button" class="btn" id="pdfX">Cerrar</button></div></div>';
    ov.querySelector('#pdfX').onclick=close;
  }
}
if(IOS_PWA){window.print=function(){const pr=document.getElementById('printroot'),html=pr?pr.innerHTML:'';window.dispatchEvent(new Event('afterprint'));if(html)pdfSheet(html)}}

/* ---------- leer la captura de una actividad (reloj / app) ---------- */
async function readShot(file){
  if(!file||!/^image\//.test(file.type))throw new Error('imagen');
  const b=await shrink(file,1568);
  const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
  const{data:s}=await sb.auth.getSession();const tok=s&&s.session&&s.session.access_token;if(!tok)throw new Error('sesion');
  const r=await fetch(/workers\.dev$|^localhost/.test(location.hostname)?'api/run-shot':'https://team-biscuit-app.tacticalbiscuittraining.workers.dev/api/run-shot',{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify({type:b.type||'image/jpeg',data})});
  let j={};try{j=await r.json()}catch(_){}
  const c0=typeof cur==='function'?cur():null;
  if(!r.ok){if(j.error==='sin_saldo'&&c0){c0.shotNoCredit=Date.now();try{saveNow()}catch(_){}}throw new Error(j.error||('http'+r.status))}
  if(c0&&c0.shotNoCredit)delete c0.shotNoCredit;
  return j;
}
