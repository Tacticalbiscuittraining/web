<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Team Biscuit · Tactical Biscuit Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Team Biscuit">
<title>Team Biscuit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: consola de entrenador. Columna izquierda con los clientes, espacio de trabajo a la derecha; en móvil la lista pasa arriba como tira horizontal. */
:root{
  --bg:#ECF2F1; --surface:#FFFFFF; --surface-2:#F4F8F7;
  --line:#D9E4E2; --line-strong:#BCCDCA;
  --fg:#112120; --muted:#546B68;
  --teal:#0E9188; --teal-ink:#0A6F68; --teal-soft:#DCF1EF;
  --coral:#E8622F; --coral-ink:#B93E14; --coral-soft:#FCE7DE;
  --btn-bg:#0B7A73; --btn-fg:#FFFFFF;
  --ink-btn:#0E1514; --ink-btn-fg:#FFFFFF;
  --badge-fg:#FFFFFF;
  --good:#1B7F47; --warn:#9A6A00; --ink:#0E1514;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A100F; --surface:#121B1A; --surface-2:#182322;
    --line:#243433; --line-strong:#35504D;
    --fg:#E6F0EE; --muted:#8FA8A4;
    --teal:#1FB5A9; --teal-ink:#56D6CB; --teal-soft:#0F2D2A;
    --coral:#F07A4B; --coral-ink:#FF9068; --coral-soft:#33190F;
    --btn-bg:#2CC4B8; --btn-fg:#041211;
    --ink-btn:#E6F0EE; --ink-btn-fg:#0A100F;
    --badge-fg:#1A0A04;
    --good:#4FCB82; --warn:#E3B04B; --ink:#060B0A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A100F; --surface:#121B1A; --surface-2:#182322;
  --line:#243433; --line-strong:#35504D;
  --fg:#E6F0EE; --muted:#8FA8A4;
  --teal:#1FB5A9; --teal-ink:#56D6CB; --teal-soft:#0F2D2A;
  --coral:#F07A4B; --coral-ink:#FF9068; --coral-soft:#33190F;
  --btn-bg:#2CC4B8; --btn-fg:#041211;
  --ink-btn:#E6F0EE; --ink-btn-fg:#0A100F;
  --badge-fg:#1A0A04;
  --good:#4FCB82; --warn:#E3B04B; --ink:#060B0A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.shell{max-width:1240px;margin:0 auto;padding-block:18px 48px;padding-inline:clamp(16px,3vw,32px)}

.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.emblem{width:56px;height:56px;flex:none;border-radius:50%;object-fit:cover;background:#000}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.brand-sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.mode{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.mode button{border:0;background:transparent;padding:7px 15px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--ink-btn);color:var(--ink-btn-fg)}
.notice{margin:0 0 16px;padding:9px 12px;border:1px dashed var(--line-strong);border-radius:8px;color:var(--muted);font-size:13.5px}
.notice b{color:var(--coral-ink)}

.app{display:grid;grid-template-columns:292px minmax(0,1fr);gap:20px;align-items:start}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rail-head{display:flex;gap:8px}
.search{flex:1;min-width:0}
#newform{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--surface-2);border-radius:10px}
#newform[hidden]{display:none}
.clist{display:flex;flex-direction:column;gap:2px}
.client{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:1px solid transparent;border-radius:10px;background:transparent;text-align:left}
.client:hover{background:var(--surface-2)}
.client[aria-current="true"]{background:var(--teal-soft);border-color:var(--line-strong)}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal-ink);font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.04em}
.client[aria-current="true"] .avatar{background:var(--teal);color:#fff}
.cl-text{display:flex;flex-direction:column;min-width:0;flex:1}
.cl-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--coral-ink);color:var(--badge-fg);font-size:12px;font-weight:700;min-width:22px;height:22px;padding:0 7px;border-radius:99px;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.badge[hidden]{display:none}
.pad{padding:8px}
.muted{color:var(--muted)}

.main{min-width:0}
.chead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.16em;font-size:14px;font-weight:600;color:var(--teal-ink);margin:0 0 2px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,5vw,42px);line-height:1.02;margin:0;text-wrap:balance;letter-spacing:.01em}
.goal{margin:5px 0 0;color:var(--muted)}
h2{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.07em;text-transform:uppercase;margin:0 0 12px;text-wrap:balance}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--teal)}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}

.btn{border:1px solid var(--line-strong);background:var(--surface);padding:8px 13px;border-radius:8px;font-weight:600;font-size:13.5px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--btn-bg);color:var(--btn-fg);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-style:dashed;color:var(--muted);background:transparent}
.btn.danger{color:var(--coral-ink)}
.btn[disabled]{opacity:.6;cursor:default}
.icon-btn{width:32px;height:32px;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--muted);font-size:20px;line-height:1}
.icon-btn:hover{background:var(--surface-2);color:var(--coral-ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

.in{width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit}
.in:hover{border-color:var(--line-strong)}
textarea.in{resize:vertical}
.num{text-align:right;font-variant-numeric:tabular-nums}
.cell{display:flex;flex-direction:column;gap:3px;min-width:0}
.lbl{display:none;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lbl.show{display:block}
.row{display:grid;gap:8px;align-items:center;padding:4px 0}
.row.head{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-bottom:2px}
.food-row{grid-template-columns:minmax(0,1fr) 84px 84px 84px 32px}
.ex-row{grid-template-columns:minmax(0,1fr) 62px 66px 70px 76px 32px}
.row.head span:not(:first-child){text-align:right}

.meal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.meal-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mname{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.06em;text-transform:uppercase;border-color:transparent;background:transparent;padding:4px 8px}
.mname:hover,.mname:focus{background:var(--surface);}
.sub{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.targets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-bottom:12px}
.tgt label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tgt-in{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.tgt-in .in{max-width:110px}
.tgt-n{margin:6px 0 0;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tgt-n b{color:var(--fg)}
.meter{height:9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.meter>i{display:block;height:100%;width:0;background:var(--teal);transition:width .25s}
.meter.over>i{background:var(--coral)}

.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{border:1px solid var(--line-strong);background:var(--surface);padding:7px 14px;border-radius:99px;font-weight:600;font-size:13.5px}
.pill[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.pill.add{border-style:dashed;color:var(--muted);background:transparent}
.pill[data-i]{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.kpi{padding:12px 14px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.k-l{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.k-v{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums}
.k-s{font-size:12.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:12.5px var(--f-body)}
.chart .ln{fill:none;stroke:var(--teal);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--teal-soft)}
.chart .pt{fill:var(--surface);stroke:var(--teal);stroke-width:2}
.chart .pt.last{fill:var(--coral);stroke:var(--coral)}
.chart .lastv{fill:var(--coral-ink);font:700 13.5px var(--f-body)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.inline{display:flex;gap:8px;align-items:flex-end;margin-top:14px;flex-wrap:wrap}
.inline .cell{flex:1;min-width:120px}

.live{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);letter-spacing:.14em;text-transform:uppercase;font-weight:600;font-size:14px;color:var(--coral-ink)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--coral);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,98,47,.55)}70%{box-shadow:0 0 0 9px rgba(232,98,47,0)}100%{box-shadow:0 0 0 0 rgba(232,98,47,0)}}
.feed-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.feed-bar .actions{margin:0}
.entry{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;padding:13px 6px;border-top:1px solid var(--line)}
.entry:first-of-type{border-top:0}
.entry.fresh{animation:flash 2.2s ease-out 1}
@keyframes flash{from{background:var(--coral-soft)}to{background:transparent}}
.e-time{font-size:12.5px;color:var(--muted);padding-top:2px}
.e-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.e-day{font-size:13px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-variant-numeric:tabular-nums}
.chip.good{color:var(--good);border-color:var(--good)}
.chip.warn{color:var(--warn);border-color:var(--warn)}
.chip.rpe{color:var(--teal-ink)}
.e-note{margin:7px 0 0;font-size:13.5px;color:var(--fg)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:12px}

.phone{max-width:440px;margin:0 auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:28px;overflow:hidden;box-shadow:0 22px 44px -28px rgba(0,0,0,.45)}
.phone-top{background:var(--ink);color:#fff;padding:18px;display:flex;gap:12px;align-items:center}
.phone-top .emblem{width:48px;height:48px}
.phone-top h3{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.04em;margin:0;line-height:1.05}
.phone-top p{margin:2px 0 0;font-size:12.5px;color:#A9C4C0;letter-spacing:.04em}
.ptabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.ptabs .tab{justify-content:center}
.phone-body{padding:14px;display:flex;flex-direction:column;gap:12px}
.exo{border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:10px}
.exo.done{background:var(--surface-2)}
.exo h4{margin:0;font-size:16px}
.exo .plan{font-size:13px;color:var(--muted);margin-top:2px}
.setrow{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.setrow span{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--muted)}
.coachnote{background:var(--teal-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}
.coachnote b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-ink);margin-bottom:2px}
.mealc{border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.mealc h4{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.07em;font-size:17px;margin:0 0 6px}
.mealc li{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:14px}
.mealc ul{list-style:none;margin:0;padding:0}
.mealc li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.notifwrap{position:relative}
.notifwrap[hidden]{display:none}
.bell{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg)}
.bell svg{width:20px;height:20px}
.bell .badge{position:absolute;top:-5px;right:-5px}
.notif{position:absolute;right:0;top:50px;z-index:20;width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:12px;box-shadow:0 18px 40px -20px rgba(0,0,0,.45)}
.notif h2{margin-bottom:6px}
.nitem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px;border:0;border-radius:10px;background:transparent}
.nitem:hover{background:var(--surface-2)}
.avatar.sm{width:32px;height:32px;font-size:14px}
.ntext{display:flex;flex-direction:column;min-width:0;flex:1}
.ntext b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ntext span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:13px}
.ntime{font-size:12px;color:var(--muted);white-space:nowrap}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ph{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.ph.sel .phimg{outline:3px solid var(--coral);outline-offset:-3px}
.phimg{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);display:block;width:100%;aspect-ratio:3/4}
.phimg img{width:100%;height:100%;object-fit:cover;display:block}
.ph figcaption{display:flex;flex-direction:column;gap:6px;font-size:13px;align-items:flex-start}
.btn.sm{padding:4px 9px;font-size:12.5px}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cmp figure{margin:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.upl{display:flex;gap:10px;align-items:flex-end}
.upl .cell{flex:1}
.filebtn{position:relative;display:inline-flex;align-items:center;cursor:pointer}
.sr-file{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.filebtn:focus-within{outline:2px solid var(--teal);outline-offset:2px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.86);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lb[hidden]{display:none}
.lb img{width:calc(100vw - 32px);max-width:960px;height:auto;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);object-fit:contain;border-radius:8px}
.thread{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{max-width:88%;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--teal-soft)}
.msg p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.mmeta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.msg.fresh{animation:flash 2.2s ease-out 1}
.ptabs{grid-template-columns:repeat(4,minmax(0,1fr))}
.ptabs .tab{padding:10px 2px;font-size:15px;letter-spacing:.05em}
.portal{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.p-top{background:var(--ink);color:#FFFFFF;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:clamp(16px,3vw,26px)}
.p-top .emblem{width:68px;height:68px}
.p-hello{flex:1 1 220px;min-width:0}
.p-eye{margin:0 0 2px;font-family:var(--f-display);font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:14px;color:#56D6CB}
.p-top h2{margin:0;font-size:clamp(30px,4.6vw,44px);line-height:1.04;letter-spacing:.01em;text-transform:none;color:#FFFFFF}
.p-goal{margin:4px 0 0;color:#A9C4C0}
.p-meta{display:flex;gap:26px;margin:0;margin-left:auto;flex-wrap:wrap}
.p-meta dt{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#A9C4C0;font-weight:600}
.p-meta dd{margin:2px 0 0;font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.p-tabs{display:flex;border-bottom:1px solid var(--line);padding-inline:clamp(6px,2vw,16px);overflow-x:auto;background:var(--surface)}
.p-tabs .tab{padding:15px 20px;font-size:18px}
.p-body{padding:clamp(14px,2.6vw,26px);display:flex;flex-direction:column;gap:18px}
.prog{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--muted)}
.prog .meter{flex:1;max-width:320px}
.prog span{white-space:nowrap;font-variant-numeric:tabular-nums}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px}
.exgrid .exo{padding:16px;gap:12px}
.exo-h{display:flex;gap:12px;align-items:flex-start}

.xc h4{margin:0;font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.07em;text-transform:uppercase}
.xc ul{margin:0;padding:10px 16px 6px 34px;font-size:14.5px}
.xc li{padding:2px 0}
.xn{margin:0;padding:8px 16px 12px;font-size:13.5px;color:var(--muted)}
.avoid{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:baseline;padding:13px 18px;border-radius:12px;background:var(--coral-soft);border:1px solid var(--coral)}
.avoid b{font-family:var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--coral-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px}
.tile b{font-family:var(--f-display);font-size:24px;letter-spacing:.04em;text-transform:uppercase}
.tile span{color:var(--muted);font-size:14px}
.pauta{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:0 28px}
.pauta>div{padding:11px 0;border-top:1px solid var(--line)}
/* un cuadro entero por ejercicio */
.exgrid{grid-template-columns:minmax(0,1fr)}
.exgrid .exo{padding:20px 22px;gap:16px}
.exo-h h4{font-size:21px}
.exo-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
.exo-l{display:flex;flex-direction:column;gap:14px;min-width:0}
.exo-r{display:flex;flex-direction:column;gap:10px;min-width:0}
.exo-l .exo-m{grid-template-columns:168px minmax(0,1fr);gap:16px}
.exo-l .exo-ph{width:168px;height:168px}
/* parte que rellena el cliente */
.todo{background:var(--teal-soft);border:1px solid var(--teal);border-left:6px solid var(--coral);border-radius:12px;padding:14px 16px;gap:8px}
.todo-h{display:flex;flex-direction:column;gap:2px;margin-bottom:4px}
.todo-t{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:var(--coral-ink)}
.todo-s{font-size:13.5px;color:var(--fg)}
.setrow2{display:grid;grid-template-columns:30px minmax(0,1.5fr) minmax(0,.9fr) minmax(0,.9fr) auto;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.setrow2:has(.setok:checked){border-color:var(--good);background:var(--surface-2)}
.sn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#fff;font-family:var(--f-display);font-weight:700;font-size:16px}
.sgoal{font-size:14px;line-height:1.3}
.sgoal b{white-space:nowrap}
.sgoal small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sin{display:flex;flex-direction:column;gap:2px;min-width:0}
.sin span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sok{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sok>span{display:none}
.sok input{width:26px;height:26px;margin:0;accent-color:var(--good);cursor:pointer}
.exo-f{margin-top:4px}
@media (max-width:980px){.setrow2{grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) auto}.setrow2 .sgoal{grid-column:2/-1}.setrow2 .sin:nth-of-type(1){grid-column:2}}
@media (max-width:820px){.exo-body{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.exgrid .exo{padding:16px}.exo-l .exo-m{grid-template-columns:104px minmax(0,1fr)}.exo-l .exo-ph{width:104px;height:104px}}
@media (max-width:980px){.trk{grid-template-columns:minmax(0,1fr)}.xcard.wide{grid-column:auto}.form-grid.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:880px){.seg{min-width:200px}.rail{gap:8px}}
@media (max-width:620px){
  .food-row{grid-template-columns:repeat(6,minmax(0,1fr))}
  .food-row .cell.name{grid-column:1/6}
  .food-row .cell.m3{grid-column:span 2}
  .food-row .cell.m2{grid-column:span 3}
  .food-row .icon-btn{grid-column:6;grid-row:1;justify-self:end;align-self:end}
  .supp-row{grid-template-columns:minmax(0,1fr) 32px}
  .supp-row .cell:first-child{grid-column:1}
  .supp-row .cell:nth-child(n+2){grid-column:1/-1}
  .supp-row .icon-btn{grid-column:2;grid-row:1;align-self:end}
  .meso-row{grid-template-columns:repeat(2,minmax(0,1fr));padding:10px 0;border-top:1px solid var(--line)}
  .meso-row .cell:first-child{grid-column:1/-1}
  .meso-row .cell:last-child{grid-column:1/-1}
  .form-grid.g3{grid-template-columns:minmax(0,1fr)}
  .form-grid.g3 .cell[style]{grid-column:auto!important}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .lib-bar{grid-template-columns:minmax(0,1fr)}
  .lib>summary{grid-template-columns:44px minmax(0,1fr)}
  .lib .lg,.lib .ls{grid-column:2}
  .p-tabs .tab{font-size:14px;padding:13px 4px;letter-spacing:.03em}
  .xc ul{padding-left:30px}
  .steps li{min-width:0;flex:1}
  .dt.adh th,.dt.adh td{padding:8px 4px}
  .mc-m{padding:9px 12px}
  .dt.adh{table-layout:auto}
  .dt.adh .hoy{display:none}
  .dt.adh thead th{font-size:10px;letter-spacing:.02em}
  .meal-head{flex-wrap:wrap}
  .meal-head .sub{order:5;flex:1 1 100%;margin-left:0;white-space:normal}
}
/* ---- acceso ---- */
.acct{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
body[data-screen="client"] .rail{display:none}
body[data-screen="client"] .app{grid-template-columns:minmax(0,1fr)}
.login{max-width:520px;margin:clamp(8px,4vh,40px) auto 0;display:flex;flex-direction:column;gap:18px}
.lg-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 22px 44px -30px rgba(0,0,0,.45)}
.lg-top{background:var(--ink);color:#fff;display:flex;gap:18px;align-items:center;padding:24px 26px}
.lg-top .emblem{width:84px;height:84px}
.lg-top h1{margin:0;font-size:clamp(32px,6vw,42px);color:#fff;text-transform:uppercase;letter-spacing:.05em}
.lg-top p{margin:4px 0 0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#A9C4C0}
.lg-form{display:flex;flex-direction:column;gap:14px;padding:24px 26px 28px}
.lg-form h2{margin:0 0 2px;font-size:22px}
.pw{position:relative}
.pw .in{padding-right:84px}
.pw .linkbtn{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px}
.lg-err{margin:0;padding:9px 12px;border-radius:8px;background:var(--coral-soft);color:var(--coral-ink);font-weight:600;font-size:14px}
.lg-err[hidden]{display:none}
.lg-btn{padding:12px;font-size:15px}
.lg-demo{border:1px dashed var(--line-strong);border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--muted)}
.lg-demo p{margin:0 0 10px}
.lg-demo b{color:var(--coral-ink)}
.btnchip{cursor:pointer;font:inherit;font-size:13px;font-weight:600;background:var(--surface)}
.btnchip:hover{border-color:var(--teal)}
@media (max-width:620px){.lg-top{padding:18px;gap:14px}.lg-top .emblem{width:64px;height:64px}.lg-form{padding:20px 18px 24px}.acct .who span:not(.avatar){max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
/* ---- v11: prescripción, tabla de dieta, sustituciones, consentimiento ---- */
.exo-g{display:inline-block;margin-top:2px;font-size:13px;color:var(--muted)}
.rx{margin:12px 0 14px;border:1px solid var(--teal);border-radius:14px;overflow:hidden;background:var(--surface)}
.rx-h{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;padding:9px 16px;background:var(--teal);color:#fff}
.rx-h span{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.12em;text-transform:uppercase}
.rx-h small{opacity:.9;font-size:13px}
.rx-g{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.rxt{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1px;padding:12px 8px;border-left:1px solid var(--line)}
.rxt:first-child{border-left:0}
.rx-l{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rx-v{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1.05;color:var(--fg);font-variant-numeric:tabular-nums}
.rx-v small{font-size:16px;font-weight:600;color:var(--muted)}
.rxt.tempo .rx-v{font-size:26px;letter-spacing:.03em}
.rx-s{font-size:12.5px;color:var(--muted)}
.rxt.rir{background:var(--coral-soft)}
.rxt.rir .rx-l,.rxt.rir .rx-s{color:var(--coral-ink)}
.rxt.rir .rx-v{color:var(--coral-ink)}
/* tabla de dieta */
.dtw{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);margin:0 0 18px}
.dtbl{width:100%;border-collapse:collapse;font-size:15px}
.dtbl caption{caption-side:top;text-align:left;padding:11px 16px;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-ink);background:var(--surface-2);border-bottom:1px solid var(--line)}
.dtbl caption.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.dtbl thead th{background:var(--teal);color:#fff;text-align:left;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:10px 12px}
.dtbl .n{text-align:right;font-variant-numeric:tabular-nums}
.dtbl tbody th,.dtbl tbody td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
.dtbl tbody td.n{text-align:right}
.dtbl tbody th{font-weight:600;white-space:nowrap}
.dtbl .hr{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.dtbl .kk{font-weight:700}
.mrow.next{background:var(--teal-soft)}
.mrow th .tag{display:block;margin-top:4px;width:max-content}
.dtbl .foods{min-width:260px}
.fl{display:flex;gap:8px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:4px 0}
.fl+.fl{border-top:1px dashed var(--line);margin-top:4px;padding-top:8px}
.fl-t{min-width:0;display:flex;gap:2px 8px;flex-wrap:wrap;align-items:baseline}
.fl-g{font-variant-numeric:tabular-nums;color:var(--muted)}
.fl-t s{color:var(--muted);font-size:13px}
.fl-t .alt{flex-basis:100%;font-size:13px;color:var(--muted)}
.fl.sw{background:var(--coral-soft);border-radius:8px;padding:6px 8px}
.fl.sw .fl-t b{color:var(--coral-ink)}
.swsel{width:auto;max-width:250px;padding:6px 8px;font-size:13.5px;min-height:34px}
.dtbl .mc-note{margin-top:8px}
.dtbl tr.trow th,.dtbl tr.trow td{background:var(--surface-2);font-weight:700;border-top:2px solid var(--teal)}
.dtbl tr.orow th,.dtbl tr.orow td{color:var(--muted);font-weight:500;font-size:14px}
.dtbl td.chg b{color:var(--coral-ink)}
.dtbl.mac thead th:first-child{width:34%}
.dtbl.sub .eqs{margin:0;padding-left:18px}
.dtbl.sub .eqs li{padding:1px 0}
.swbar{display:flex;gap:12px 20px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--teal-soft);border:1px solid var(--line);margin:0 0 14px}
.swbar b{display:block}
.swbar span{font-size:14px;color:var(--muted)}
.swbar.on{background:var(--coral-soft);border-color:var(--coral)}
.swbar .actions{margin:0}
/* consentimiento */
.consent{max-width:860px;margin:0 auto;border:1px solid var(--line);border-top:5px solid var(--teal);border-radius:14px;background:var(--surface);padding:22px 24px}
.consent>header{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.c-ic{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:var(--teal-soft);color:var(--teal-ink)}
.consent h3{margin:0;font-size:22px}
.c-list{margin:0;display:grid;gap:0}
.c-list>div{padding:11px 0;border-top:1px solid var(--line)}
.c-list dt{font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--teal-ink);margin-bottom:2px}
.c-list dd{margin:0;font-size:15px;line-height:1.5}
.c-chk{display:grid;gap:10px;margin:14px 0;padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.c-chk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;line-height:1.4}
.c-chk input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--teal)}
.consent .actions{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
.consent .btn[disabled]{opacity:.45;cursor:not-allowed}
.consent-ok{margin:0 0 12px;padding:9px 12px;border-radius:10px;background:var(--teal-soft);font-size:14px}
.consent-ok.row{margin:14px 0 0}
@media (max-width:900px){.rx-g{grid-template-columns:repeat(3,minmax(0,1fr))}.rxt:nth-child(4){border-left:0}.rxt:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:760px){
  .dtbl thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .dtbl,.dtbl tbody,.dtbl tr,.dtbl tbody th,.dtbl tbody td{display:block}
  .dtbl tbody tr{border-top:1px solid var(--line);padding:10px 12px}
  .dtbl tbody th,.dtbl tbody td{border:0;padding:3px 0;white-space:normal}
  .dtbl tbody tr:first-child{border-top:0}
  .dtbl td[data-l]:not(.foods)::before{content:attr(data-l);float:left;color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .dtbl td.n{display:flex;justify-content:space-between}
  .dtbl .hr{display:block}
  .dtbl .foods{min-width:0;padding:6px 0}
  .dtbl tr.trow th,.dtbl tr.orow th{padding:0}
  .dtbl.mac tbody th{padding-bottom:0}
  .dtbl.mac td.muted{display:block;text-align:left}
  .dtbl.sub td.n,.dtbl.sub td{display:block}
  .dtbl.sub td[data-l]::before{display:block;float:none}
  .swsel{max-width:100%;width:100%}
  .consent{padding:16px}
}
@media (max-width:480px){.rx-v{font-size:28px}.rxt.tempo .rx-v{font-size:22px}}
/* ---- v12: comidas bien separadas, plan completo, pantalla completa, impresión ---- */
.dtbl .mrow>th{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1;letter-spacing:.05em;text-transform:uppercase;color:var(--teal-ink);white-space:normal;border-left:6px solid var(--teal);padding:20px 14px}
.dtbl .mrow>td{padding-top:20px;padding-bottom:20px}
.dtbl tbody tr.mrow{border-top:0}
.dtbl .mrow>th,.dtbl .mrow>td{border-top:4px solid var(--surface-2)}
.dtbl .mrow:nth-child(even)>th,.dtbl .mrow:nth-child(even)>td{background:#f6f9f8}
.dtbl .mrow.next>th,.dtbl .mrow.next>td{background:var(--teal-soft)}
.dtbl .mrow:first-child>th,.dtbl .mrow:first-child>td{border-top:0}
.mrow th .tag{font-family:var(--f-body,inherit);font-size:11px;letter-spacing:.08em}
.pl{display:flex;justify-content:space-between;gap:14px;padding:3px 0;border-bottom:1px dashed var(--line)}
.pl:last-of-type{border-bottom:0}
.plan-bar{display:flex;gap:10px 16px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.psheet{display:grid;gap:0}
.ps-h{display:flex;gap:16px;align-items:center;margin:0 0 16px;padding:0 0 14px;border-bottom:3px solid var(--teal)}
.ps-h .emblem{width:64px;height:64px}
.ps-h h2{margin:0;font-size:28px}
.fsov{position:fixed;inset:0;z-index:70;overflow:auto;overscroll-behavior:contain;background:var(--surface);padding:0 clamp(16px,4vw,48px) 40px}
.fs-bar{position:sticky;top:0;z-index:2;display:flex;gap:10px 16px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:calc(12px + env(safe-area-inset-top)) 0 12px;background:var(--surface);border-bottom:1px solid var(--line);margin-bottom:18px}
.fs-bar b{font-family:var(--f-display);font-size:19px;letter-spacing:.1em;text-transform:uppercase}
#printroot{display:none}
@media (max-width:760px){
  .dtbl .mrow>th{display:block;background:var(--teal);color:#fff;border:0;margin:-10px -12px 8px;padding:12px 14px;font-size:22px;width:auto}
  .dtbl .mrow>th .tag{display:inline-block;margin-left:8px;background:#fff;color:var(--teal-ink)}
  .dtbl tbody tr.mrow{padding-top:10px;border-top:0;margin-bottom:0}
  .dtbl .mrow>td{border-top:0!important;padding-top:3px;padding-bottom:3px}
  .dtbl .mrow>td{background:transparent!important}
  .dtbl .mrow>th{background:var(--teal)!important}
  .dtbl tbody tr.mrow{border-bottom:6px solid var(--surface-2)}
  .dtbl .mrow.next{background:var(--teal-soft)}
}
@media print{
  @page{size:A4;margin:12mm}
  body.printing>*{display:none!important}
  body.printing>#printroot{display:block!important}
  body.printing{background:#fff!important}
  #printroot *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printroot .dtbl{font-size:12px}
  #printroot .dtw{break-inside:avoid;margin-bottom:12px}
  #printroot .dtbl .mrow>th{font-size:16px;padding:8px 10px}
  #printroot .noprint{display:none}
}
/* ---- v13: plan completo = réplica de la plantilla Word ---- */
.psheet{--nv:#264653;--tl:#2A9D8F;--lt:#E3F2EF;--zb:#F6F9F8;--bd:#BFD9D4;--gd:#E9C46A;--gy:#6B7C85;
  display:block;max-width:900px;margin:0 auto;padding:22px 34px 26px;background-color:#fff;background-repeat:repeat-y;background-position:center 160px;background-size:min(520px,80%) auto;
  border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.06);color:var(--nv);font-family:Arial,Helvetica,sans-serif;font-size:12.5px;line-height:1.35}
.ps-run{display:flex;align-items:center;gap:8px;padding-bottom:7px;border-bottom:2px solid var(--tl);margin-bottom:16px}
.ps-run img{width:24px;height:24px;border-radius:4px;background:#111}
.ps-run b{font-size:13px;text-transform:uppercase;color:var(--nv)}
.ps-run em{font-size:11px;color:var(--gy)}
.ps-run span{margin-left:14px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--tl)}
.ps-title h2{margin:6px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:700;letter-spacing:0;text-transform:uppercase;color:var(--nv)}
.ps-title p{margin:0 0 14px;font-size:14px;font-style:italic;color:var(--tl)}
.ps-sec{display:flex;align-items:baseline;gap:8px;margin:20px 0 12px;padding:4px 10px;background:var(--nv);color:#fff;font-family:Arial,Helvetica,sans-serif;font-size:13.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;border-left:6px solid var(--gd)}
.ps-num{color:var(--gd)}
.ps-sec em{font-size:11px;font-weight:400;font-style:italic;text-transform:none;color:#BFD9D4}
.ps-sub{margin:14px 0 6px;font-size:12.5px;font-weight:700;text-transform:uppercase;color:var(--tl)}
section>.ps-sub:first-child{margin-top:0}
.ps-ref{margin:6px 0 10px;font-size:11px;font-style:italic;color:var(--gy)}
.ps-x{overflow-x:auto;margin-bottom:10px}
.ps-t{width:100%;border-collapse:collapse;background:rgba(255,255,255,.82)}
.ps-t th,.ps-t td{font-size:11.5px;line-height:1.35;border:1px solid var(--bd);padding:7px 8px;vertical-align:middle;text-align:left}

/* Resumen del cliente: cifras a lo ancho y actividad debajo */
.sum{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:1100px){.feed2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}}
/* ejercicios unilaterales: reps de cada lado */
.uni-w{display:flex;gap:4px}
.uni-w .whg{flex:1;min-width:0}
.tx-b .setrow2.uni{grid-template-columns:minmax(0,1fr) 136px 44px}
/* revisión 16 oct: el cliente no ve la barra superior (logo, nombre, ajustes); su perfil se abre desde la cabecera */
body[data-screen="client"][data-who="client"] .shell>.top{display:none}
body[data-screen="client"][data-who="client"] .shell{padding-top:calc(10px + env(safe-area-inset-top))}
.p-me{display:grid;place-items:center;width:46px;height:46px;padding:0;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);cursor:pointer}
.p-me .avatar{width:32px;height:32px;font-size:12px}
.p-me:hover{background:rgba(255,255,255,.16)}
.p-me:focus-visible{outline:2px solid #5FD3C4;outline-offset:2px}
.p-top .p-hello{padding-right:118px}
/* menú inferior: 5 secciones que caben sin deslizar */
.pd{flex:1 1 0;width:auto;min-width:0}
/* pie del cliente compacto: © y versión juntos, justo encima del menú inferior */
body[data-screen="client"] .tb-copy{margin:14px auto 0}
body[data-screen="client"] .app-ver{margin-top:4px}
body[data-screen="client"] .shell{padding-bottom:0;box-sizing:border-box;display:flex;flex-direction:column;min-height:calc(100vh - 130px);min-height:calc(100svh - 130px - env(safe-area-inset-bottom))}
body[data-screen="client"] .shell>#app{flex:1 0 auto}
.ib-more{margin-top:14px}
.ib-more>summary{cursor:pointer;padding:10px 4px;font-weight:700;color:var(--muted);list-style-position:inside}
.ib-more .ib-list{margin-top:6px}
/* entrenador en el móvil: Panel · Clientes · Mensajes · Biblioteca abajo, al alcance del pulgar */
@media (max-width:880px){
  body[data-screen="coach"] .seg{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));z-index:60;width:calc(100% - 12px);max-width:620px;min-width:0;margin:0 auto;padding:5px;gap:0;border-radius:30px;background:rgba(28,32,33,.86);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);border:1px solid rgba(255,255,255,.12);box-shadow:0 12px 34px -10px rgba(0,0,0,.55)}
  body[data-screen="coach"] .seg button{padding:14px 2px;border-radius:24px;font-size:13px;color:rgba(255,255,255,.86)}
  body[data-screen="coach"] .seg button[aria-pressed="true"]{background:rgba(0,0,0,.45);color:#5FD3C4}
  body[data-screen="coach"] .shell{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  body[data-screen="coach"] .rail:has(>.rail-head[hidden]),body[data-screen="coach"][data-ml="0"] .rail{display:contents}
  body[data-screen="coach"] .toast,body[data-screen="coach"] .sync{bottom:calc(92px + env(safe-area-inset-bottom))}
}
/* chat del cliente: al abrir Mensajes ocupa toda la pantalla, de arriba hasta el menú inferior */
body[data-screen="client"] .chat-card.cli{scroll-margin-top:calc(8px + env(safe-area-inset-top))}
body[data-screen="client"] .chat-card.cli .chat{height:calc(100vh - 112px - env(safe-area-inset-top) - env(safe-area-inset-bottom));height:calc(100svh - 112px - env(safe-area-inset-top) - env(safe-area-inset-bottom));min-height:360px}

/* mensajes: cabecera compacta y burbujas recibidas con más contraste en oscuro */
@media (max-width:620px){.ch-h{padding:9px 14px;gap:10px}.ch-h .avatar,.ch-coach{width:36px;height:36px}.ch-h b{font-size:15px}}
:root[data-theme="dark"] .bub:not(.me){background:var(--surface-2);border-color:#24302f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bub:not(.me){background:var(--surface-2);border-color:#24302f}}
.ch-new{display:flex;align-items:center;gap:10px;margin:10px 0 8px;color:var(--teal-ink);font-size:12px;font-weight:700}
.ch-new::before,.ch-new::after{content:"";flex:1;height:1px;background:color-mix(in srgb,var(--teal) 55%,transparent)}
.bub[data-del]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ch-back{flex:none;width:38px;height:38px;margin-right:-2px;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--fg);font:inherit;font-size:20px;line-height:1;cursor:pointer}
.ch-back:hover{border-color:var(--teal)}
textarea.ch-in{resize:none}
/* ---------- fotos de progreso ---------- */
.ph .card h2{margin-bottom:12px}
.ph-n{font-family:inherit;font-size:14px;font-weight:600;letter-spacing:0}
.phsil{width:44px;height:55px;color:var(--muted);flex:none}
.phsil.sm{width:16px;height:20px}
.phsil.xl{width:64px;height:80px;opacity:.75}
.ph-coach-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.ph-coach-h h2{margin:0}
.ph-next{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.ph-next>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.ph-next span{color:var(--muted);font-size:13.5px}
.ph-next.due{border-color:var(--teal);background:var(--teal-soft)}
.ph-next .btn{flex:none;padding:10px 14px;border-radius:999px;font-size:14px}
.phc-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.phc-h h2{margin:0!important}
.seg-s{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg-s button{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer}
.seg-s button[aria-pressed="true"]{background:var(--teal);color:#fff}
.phc-poses{display:flex;gap:6px;margin:0 0 12px}
.phc-poses button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.phc-poses button[aria-selected="true"]{border-color:var(--teal);color:var(--teal-ink);background:var(--teal-soft)}
.phc-poses button[aria-selected="true"] .phsil{color:var(--teal-ink)}
.phc{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#0d1312;user-select:none;-webkit-user-select:none;touch-action:pan-y;max-height:70vh;margin:0 auto}
.phc img,.phc2-i img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.phc-b{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--x)) 0 0)}
.phc-line{position:absolute;top:0;bottom:0;left:var(--x);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.45);pointer-events:none}
.phc-line i{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:15px;letter-spacing:-1px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.phc-r{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;-webkit-appearance:none;appearance:none;touch-action:pan-y}
.phc-tag{position:absolute;top:10px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;pointer-events:none;backdrop-filter:blur(4px)}
.phc-tag.l{left:10px}.phc-tag.r{right:10px}
.phc2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phc2-i{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:0;padding:0;background:#0d1312;cursor:zoom-in}
.phc2-i.ghost{cursor:default;background:var(--surface-2);border:1.5px dashed var(--line-strong);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;text-align:center;color:var(--muted);font-size:13px}
.phc-ds{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:12px}
.phc-d{display:flex;flex-direction:column;gap:2px;min-width:0}
.phc-d.r{align-items:flex-end;text-align:right}
.phc-d>span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.phc-d b{font-size:15px}
.phc-sel{appearance:none;-webkit-appearance:none;border:0;background:none;color:var(--fg);font:inherit;font-weight:700;font-size:16px;padding:0 16px 0 0;cursor:pointer;max-width:100%;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-size:5px 5px,5px 5px;background-position:calc(100% - 7px) 55%,calc(100% - 2px) 55%;background-repeat:no-repeat}
.phc-mid{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:12px;background:var(--surface-2);font-size:13px;white-space:nowrap}
.phs-l{display:flex;flex-direction:column;gap:14px}
.phs{display:flex;flex-direction:column;gap:8px}
.phs+.phs{padding-top:14px;border-top:1px solid var(--line)}
.phs header{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.phs header b{font-size:16px}
.phs header span:not(.badge){color:var(--muted);font-size:13.5px}
.phs header .badge{margin-left:auto}
.phs-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.phs-t{position:relative;aspect-ratio:3/4;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--surface-2);cursor:zoom-in}
.phs-t img{width:100%;height:100%;object-fit:cover;display:block}
.phs-t span{position:absolute;left:6px;bottom:6px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;font-weight:600}
.ph-lock{margin:0;padding:10px 4px;color:var(--muted);font-size:13px;text-align:center}
.ph-lock .linkbtn{font-size:13px;color:var(--muted);font-weight:500}
.ph-empty{text-align:center;padding:22px 18px}
.ph-empty h2{margin:6px 0 6px}
.ph-empty p{margin:0 auto 16px;max-width:420px}
.phe-sil{display:flex;justify-content:center;gap:14px;margin-bottom:6px}
.phe-sil figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 10px 8px;border-radius:14px;background:var(--surface-2);border:1px dashed var(--line-strong)}
.phe-sil figcaption{font-size:12px;color:var(--muted);font-weight:600}
.btn.big{padding:13px 22px;font-size:16px;border-radius:999px}
.phn-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.phn-s{position:relative;aspect-ratio:3/4;border-radius:12px;border:1.5px dashed var(--line-strong);background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.phn-s.done{border:0}
.phn-s img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.phn-l{position:absolute;left:0;right:0;bottom:0;padding:16px 4px 6px;text-align:center;font-size:13px;font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff}
.phn-s:not(.done) .phn-l{background:none;color:var(--fg)}
.phn-c{position:absolute;top:6px;right:6px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;font-weight:600}
.phn-c.add{width:26px;height:26px;padding:0;display:grid;place-items:center;background:var(--teal);font-size:16px}
.phn-date{display:block;margin-bottom:10px}
.phn-tips{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.phn-tips summary{cursor:pointer;font-weight:600;font-size:14px}
.phn-tips ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.phn-tips li{display:flex;gap:10px;align-items:flex-start}
.phn-tips li>span{font-size:18px;line-height:1.2}
.phn-tips li div{display:flex;flex-direction:column}
.phn-tips small{color:var(--muted);font-size:13px}
.phv{position:fixed;inset:0;z-index:99995;background:#050807;display:flex;flex-direction:column;color:#fff;animation:wsf .15s ease-out}
.phv-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px}
.phv-top>div{display:flex;flex-direction:column}
.phv-top span{font-size:13px;color:rgba(255,255,255,.7)}
.phv .icon-btn{color:#fff;font-size:22px;width:40px;height:40px}
.phv-img{flex:1;min-height:0;display:grid;place-items:center;padding:0 8px;touch-action:pan-y}
.phv-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.phv-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:26px;line-height:1;cursor:pointer}
.phv-nav.prev{left:10px}.phv-nav.next{right:10px}
.phv-bot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px calc(14px + env(safe-area-inset-bottom));font-size:13px;color:rgba(255,255,255,.7)}
.phv-bot .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
@media (min-width:900px){.phc-card .phc{max-width:520px}.phc-card .phc2{max-width:620px;margin:0 auto}.phs-g{grid-template-columns:repeat(auto-fill,minmax(130px,170px))}}
.phc-mode{display:flex;justify-content:center;margin-top:10px}
.phc{max-height:56vh}
.phc-ds{align-items:start}
.phc-d{align-items:flex-start}
.phc-d.r{align-items:flex-end}
.phc-mid{align-self:center}
.ph-next b{font-size:15px}
.ph-next span{font-size:13px}
@media (prefers-reduced-motion:reduce){
  .live i,.entry.fresh,.msg.fresh{animation:none}
  .meter>i,.toast{transition:none}
}
/* ---------- versión real ---------- */
.sync{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface);color:var(--muted);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.12);transition:opacity .3s;pointer-events:none}
.sync[data-st="idle"]{opacity:0}
.sync[data-st="ok"]{color:var(--teal-ink,#0f766e)}
.sync[data-st="err"],.sync[data-st="off"]{color:#b42318;border-color:#f4b5ab}
.lg-help{margin:12px 0 0;font-size:13px;text-align:center}
.lg-load{text-align:center}
.lg-spin{width:34px;height:34px;margin:22px auto 6px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--teal,#14907f);animation:lgspin .8s linear infinite}
@keyframes lgspin{to{transform:rotate(360deg)}}
#newform .nf-acc{display:flex;flex-direction:column;gap:8px;padding-top:6px;border-top:1px dashed var(--line)}
#newform .nf-row{display:flex;gap:6px}
#newform .nf-row .in{flex:1;min-width:0}
.acc-card .acc-l{list-style:none;margin:8px 0 12px;padding:0}
.acc-card .acc-l li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.acc-card .acc-l span{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.acc-card .acc-l b{font-weight:600;word-break:break-all;text-align:right}
.acc-card b.ok{color:var(--teal-ink,#0f766e)}
.acc-card b.warn{color:#b42318}
.acc-card .acc-new{margin:0 0 12px;padding:12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.acc-card .acc-new p{margin:0 0 8px;font-size:14px}
.acc-card pre{white-space:pre-wrap;word-break:break-word;margin:0 0 10px;font:13px/1.5 inherit;font-family:inherit;color:var(--fg)}
.acc-card .acc-pw{display:flex;flex-direction:column;gap:8px}
.acc-card .actions{margin:0;flex-wrap:wrap}
.newver{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-radius:12px;background:#1f2a28;color:#fff;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 24px)}
.pdfov{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg,#eef3f2)}
.pdf-box{width:min(380px,100%);text-align:center;padding:22px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.15)}
.pdf-box p{margin:6px 0}
.pdf-box .actions{justify-content:center;margin-top:14px;gap:10px;display:flex;flex-wrap:wrap}
.pdf-ic{font-size:34px}
#pdfroot{position:absolute;left:0;top:0;width:794px;z-index:150;background:#fff;color:#1b2b2f}
.pdfx .noprint{display:none!important}
.pdfx{background:#fff}
.pdfx .ps-t th,.pdfx .ps-t td{padding:4px 6px}
.pdfx section>:last-child{margin-bottom:0}

body.pv #main input,body.pv #main textarea,body.pv #main .whx{pointer-events:none}
body.pv #main .whx,body.pv #main input,body.pv #main textarea{opacity:.85}
.app-ver{margin:18px 0 calc(18px + env(safe-area-inset-bottom));text-align:center;font-size:11px;color:var(--muted);opacity:.7}

/* guía de instalación */
.inst{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:80;background:var(--surface,#fff);color:var(--fg,#111);border:1px solid var(--line,#ddd);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.22);padding:14px;max-width:460px;margin:0 auto;animation:instUp .25s ease-out}
@keyframes instUp{from{transform:translateY(20px);opacity:0}}
.inst-c{display:flex;gap:12px;align-items:flex-start}
.inst-c img{border-radius:10px;flex:none}
.inst-c b{font-size:15px}
.inst-c ol{margin:6px 0 4px;padding-left:18px;font-size:14px;line-height:1.5}
.inst-c p{margin:6px 0 4px;font-size:14px}
.inst-c small{color:var(--muted,#666);font-size:12.5px}
.inst-a{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
@media (prefers-reduced-motion:reduce){.inst{animation:none}}
/* iPhone (app en pantalla de inicio): que el logo no quede debajo de la hora y la batería */
.shell{padding-top:calc(18px + env(safe-area-inset-top))}

/* importar Word / Excel */
.impbox{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.45)}
.impbox-c{width:100%;max-width:520px;max-height:85vh;overflow:auto;background:var(--surface,#fff);color:var(--fg,#111);border:1px solid var(--line,#ddd);border-radius:16px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.impbox-l{margin:6px 0 0;padding-left:18px;line-height:1.6}
.impbox-w{margin:6px 0 0;padding-left:18px;color:#b45309;line-height:1.5;font-size:14px}
p.impbox-w{padding-left:0}
.impbox-ok{margin:12px 0 0;color:#0f766e;font-weight:600}
.impbox-sp{width:34px;height:34px;margin:14px auto 0;border-radius:50%;border:3px solid var(--line,#ddd);border-top-color:#0E9188;animation:ibsp 1s linear infinite}
@keyframes ibsp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.impbox-sp{animation:none}}

.ph>summary{cursor:pointer;list-style:none}
.ph>summary::-webkit-details-marker{display:none}
.ph-l{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ph-i{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line,#ddd);border-radius:12px}
.ph-i.now{border-color:#0E9188}
.ph-i>div:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.ph-i span{font-size:13px;color:var(--muted,#666)}
.ph-a{display:flex;gap:6px;flex:none;flex-wrap:wrap}
.ph-l .ph-i{flex-direction:column;align-items:stretch}
.ph-row{flex:1 1 100%;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line,#ddd)}
.ph-row>span{font-size:13px}
@media (max-width:520px){.ph-i{flex-direction:column;align-items:stretch}.ph-a{justify-content:flex-end}}
.lg-err.ok{background:var(--teal-soft);color:var(--teal-ink)}

/* entrenamiento con el diseño del Excel */
.xsheet{max-width:960px;margin:20px auto;background:#fff;color:#1F2D33;padding:22px;border-radius:10px;font:13px/1.35 Arial,Helvetica,sans-serif}
.xs-h{display:flex;justify-content:space-between;align-items:center;background:#264653;color:#fff;padding:8px 10px}.xs-h b{font-size:19px}.xs-h img{height:38px;border-radius:4px}
.xs-hs{background:#2A9D8F;color:#fff;font-style:italic;font-size:12px;padding:3px 10px;margin-bottom:14px}
.xs-sec{background:#264653;color:#fff;font-weight:700;font-size:12px;padding:5px 12px;margin:16px 0 0;white-space:pre-wrap}.xs-sec.or{background:#F4A261}
.xs-x{overflow-x:auto}
.xs-t{width:100%;border-collapse:collapse;font-size:12px}.xs-t thead th{background:#2A9D8F;color:#fff;font-weight:700;text-transform:uppercase;font-size:10.5px;padding:8px 6px;border:1px solid #D5E2DF}
.xs-t td,.xs-t tbody th{border:1px solid #D5E2DF;padding:5px 7px;text-align:center}.xs-t tbody tr:nth-child(even){background:#F6F9F8}.xs-t tbody th{font-weight:700;color:#264653}
.xs-t td.b{color:#1F5FA8}.xs-t td.l{text-align:left}
.xs-2{display:flex;gap:24px;flex-wrap:wrap}.xs-kv{border-collapse:collapse;flex:1 1 300px;font-size:12px}.xs-kv th{background:#E3F2EF;color:#264653;text-align:left;padding:5px 8px;border:1px solid #D5E2DF;width:120px}.xs-kv td{color:#1F5FA8;font-weight:700;padding:5px 8px;border:1px solid #D5E2DF}
.xs-side{display:flex;flex-direction:column;gap:2px;padding-top:8px}.xs-side span{font-size:10px;color:#6B7C85;margin-top:8px}.xs-side b{color:#2A9D8F;font-size:16px}
.xs-txt{border:1px solid #D5E2DF;padding:6px 10px;color:#1F5FA8}
.xs-day{margin-top:34px}
.xs-t thead th.xs-y{background:#E9C46A;color:#264653}.xs-t td.xs-y{background:#FBF3DC}
.ph-tag{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-right:4px;vertical-align:1px}
.ph-diet{background:rgba(14,145,136,.15);color:#0E9188}
.ph-training{background:rgba(224,122,30,.16);color:#C9671A}
.ph-h{margin:16px 0 8px;font-size:15px;display:flex;align-items:center;gap:6px}
.plan-bar{margin:0 0 12px}
/* resumen: la fecha de próxima revisión no se sale de su tarjeta */
.kpi{container-type:inline-size}
.k-v{font-size:min(28px,21cqi);overflow-wrap:anywhere}
@media (max-width:620px){.k-v{font-size:min(23px,21cqi)}}

@media print{#printroot .xsheet{max-width:none;margin:0;padding:0;border-radius:0;font-size:11px}#printroot .xs-day{break-before:page}#printroot .xs-t tr{break-inside:avoid}#printroot .xs-x{overflow:visible}}
#app .xsheet{box-sizing:border-box;width:100%;max-width:100%;min-width:0;margin:8px 0 16px;padding:clamp(10px,3vw,22px)}
#app .xs-h b{font-size:clamp(15px,4.4vw,19px)}
.del-doc{padding:12px;border:1px solid var(--line,#ddd);border-radius:12px;background:rgba(42,157,143,.06)}
.lg-card .lg-try{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 26px;background:var(--ink);color:#fff;text-decoration:none}
.lg-card .lg-try b{display:block;font-size:15.5px}
.lgd-s{display:block;font-size:13px;color:#A9C4C0;margin-top:2px}
.lgd-go{flex:none;display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;background:var(--teal);color:#fff;font-weight:600;font-size:14.5px;transition:transform .15s}
.lg-card .lg-try:hover .lgd-go{transform:translateX(2px)}
.lg-card .lg-try:focus-visible{outline:3px solid var(--teal);outline-offset:-3px}
/* aviso de derechos al pie */
.tb-copy{margin:28px auto 8px;text-align:center;font-size:11.5px;color:var(--muted);opacity:.8}
@media print{.tb-copy{display:none}}
/* logotipo de fondo: marca de agua sutil, fija y centrada; toma el color del tema (claro/oscuro) */
body::before,.hub::before{content:"";pointer-events:none;background:var(--fg,#264653);opacity:.05;-webkit-mask:url(icons/marca.webp?v=1) center/min(78vw,78vh,560px) no-repeat;mask:url(icons/marca.webp?v=1) center/min(78vw,78vh,560px) no-repeat}
body::before{position:fixed;inset:0;z-index:-1}
/* el inicio del cliente va sobre una hoja opaca: la marca se repite dentro, pegada a la pantalla al desplazarse */
.hub{overflow:clip;isolation:isolate}
.hub::before{display:block;position:sticky;top:0;height:100vh;height:100svh;margin-bottom:-100vh;margin-bottom:-100svh;z-index:-1;opacity:.06}
@media print{body::before,.hub::before{display:none}}
@media (max-width:600px){[data-act=pushCoach] .pc-t{display:none}}
.da-st{margin:0;padding:10px 12px;border-radius:12px;border-left:4px solid var(--coral);background:var(--card,rgba(0,0,0,.03));font-size:14px;line-height:1.4}
.pnew-chg{margin:6px 0 0;padding-left:18px;font-size:13.5px;color:var(--muted);display:grid;gap:2px}
.bk-n{margin:4px 2px 0;font-size:13px}.bk-n .linkbtn{font-size:13px}

/* en Mensajes el aviso «Guardado» tapaba el cuadro de escribir: ya lo dicen los ✓ del mensaje (los errores sí se ven) */
body:has(#mText) .sync:not([data-st="err"]):not([data-st="off"]){opacity:0}
.pn-sched{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,#0E9188 10%,var(--surface,#fff));font-size:14px;line-height:1.4}
.pn-sched>span:first-of-type{flex:1 1 220px}
.pn-a{display:flex;gap:8px}
.imp-at{display:flex;align-items:center;gap:8px;margin-right:auto;font-size:14px}
.imp-at .in{width:auto}
.plan-bar .pn-sched{flex:1 1 100%}
.pc-st{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.pc-st i{font-style:normal;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,#0E9188 12%,transparent);color:var(--fg)}
.pc-st i.warn{background:color-mix(in srgb,#E9C46A 35%,transparent)}
.pc-st i.hot{background:color-mix(in srgb,#E76F51 22%,transparent);color:#C2462A}
.plan-bar.drop{outline:2px dashed #0E9188;outline-offset:3px;background:color-mix(in srgb,#0E9188 8%,var(--surface,#fff))}
.pc-dr{display:none}
@media (hover:hover) and (pointer:fine){.pc-dr{display:inline}}
.ph-or{display:inline-block;margin-top:3px;font-size:12px;font-weight:600;color:#0E9188}
.da-w{display:flex;flex-direction:column;gap:6px}
.da-w .da-up{align-self:flex-end}
@media (max-width:560px){
  .plan-bar{gap:8px;padding:14px}
  .plan-bar .pc-d{display:none}
  .plan-bar .tpl-a{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
  .plan-bar .tpl-a>*{justify-content:center;text-align:center;width:100%}
  .da-w .da-up{align-self:stretch}
}
